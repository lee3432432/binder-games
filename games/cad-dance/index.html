<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>CAD 댄스 · 커맨드 플레이</title>
<meta name="description" content="도면 위 막대인간 8명의 관절을 드래그해서 늘리고 꺾으면 8명이 똑같이 춤춰요. 녹화해서 음악에 맞춰 반복 재생까지.">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#212830;color:#d8e2ee;font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#2b333d;border-bottom:1px solid #3b4652;flex-wrap:wrap}
.bar .t{font-weight:900;font-size:15px;margin-right:4px;white-space:nowrap}
.bar .t small{font-family:"Share Tech Mono",monospace;color:#7d8fa3;font-weight:400;font-size:11px;margin-left:4px}
.b{border:1px solid #47566a;background:#36414e;color:#e3ecf6;font:inherit;font-weight:700;font-size:12px;border-radius:5px;padding:5px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
.b:hover{background:#405062}
.b.on{background:#1e6fff;border-color:#4d8dff}
.b.rec.on{background:#d9324a;border-color:#ff6a7f;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
#wrap{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:none}
#cmd{flex:none;background:#1a2027;border-top:1px solid #3b4652;font-family:"Share Tech Mono","Noto Sans KR",monospace;font-size:12px;line-height:1.5;padding:4px 8px 6px;color:#9fb0c2;min-height:62px}
#cmd .h{color:#6e7f92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmd .cur{color:#e9f1fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmd .cur:after{content:"▌";animation:blink 1s steps(2) infinite;margin-left:2px;color:#9fd0ff}
#tip{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,26,33,.85);border:1px solid #47566a;color:#e3ecf6;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;pointer-events:none;transition:opacity .5s;white-space:nowrap}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(22,28,35,.82);z-index:5;text-align:center;padding:20px}
#start.off{display:none}
#start h1{font-family:"Share Tech Mono",monospace;font-size:clamp(34px,8vw,64px);color:#fff;letter-spacing:.04em}
#start h1 span{color:#4d8dff}
#start p{color:#b8c6d6;font-weight:700;line-height:1.7;font-size:14px}
#start p b{color:#7fe08f}
#go{font:inherit;font-weight:900;font-size:20px;padding:10px 34px;border-radius:8px;border:2px solid #4d8dff;background:#1e6fff;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <a class="b" href="/">🏠</a>
    <span class="t">CAD 댄스<small>STRETCH.dwg</small></span>
    <button class="b" id="music">♪ 음악</button>
    <button class="b rec" id="rec">● 녹화</button>
    <button class="b" id="play">▶ 재생</button>
    <button class="b" id="rand">🎲 자동 춤</button>
    <button class="b" id="undo">↶ 취소</button>
    <button class="b" id="reset">⟲ 원래대로</button>
    <button class="b" id="cnt">8명</button>
  </div>
  <div id="wrap"><canvas id="c"></canvas><div id="tip">관절을 드래그하거나, 빈 곳을 끌어서 박스로 선택하세요</div>
    <div id="start"><h1>CAD <span>DANCE</span></h1>
      <p>도면 위 막대인간 8명은 전부 <b>같은 도면</b>이에요.<br>관절 하나를 잡아 끌면 8명이 똑같이 늘어나고 꺾여요.<br>빈 곳을 드래그하면 박스 선택 → 파란 점을 잡고 끌기!</p>
      <button id="go">도면 열기</button></div>
  </div>
  <div id="cmd"><div class="h" id="h1"></div><div class="h" id="h2"></div><div class="cur" id="cur">명령:</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1;
/* ---------- 막대인간 뼈대 (골반 기준 단위좌표, y 아래로 +) ---------- */
const J=['head','neck','hip','lElb','lHand','rElb','rHand','lKnee','lFoot','rKnee','rFoot'];
const BASE={head:[0,-1.58],neck:[0,-1.18],hip:[0,0],lElb:[-.32,-.78],lHand:[-.5,-.38],rElb:[.32,-.78],rHand:[.5,-.38],lKnee:[-.2,.55],lFoot:[-.3,1.1],rKnee:[.2,.55],rFoot:[.3,1.1]};
const BONES=[['neck','hip'],['neck','lElb'],['lElb','lHand'],['neck','rElb'],['rElb','rHand'],['hip','lKnee'],['lKnee','lFoot'],['hip','rKnee'],['rKnee','rFoot']];
const HEAD_R=.3;
let off={};J.forEach(k=>off[k]=[0,0]);
let target=null;// 자동 춤 목표 포즈
let sel=new Set(),hover=null,drag=null,box=null,mouse={x:-99,y:-99,in:false,touch:false};
let count=8,figs=[],U=40;
let undoStack=[];
function layout(){const cols=count===8?(W>H*1.15?8:4):(W>H*1.15?8:4);const rows=Math.ceil(count/cols);
  U=Math.min(W/(cols*1.35),(H-30)/(rows*3.4));figs=[];const gx=W/cols;const gy=(H-10)/rows;
  for(let i=0;i<count;i++){const c=i%cols,r=Math.floor(i/cols);figs.push({x:gx*(c+.5),y:10+gy*r+(gy-U*3.2)/2+U*2.05})}}
function resize(){DPR=Math.min(2,devicePixelRatio||1);const r=$('wrap').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);layout()}
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(document.getElementById('wrap'));
function P(f,k){const b=BASE[k],o=off[k];return[f.x+(b[0]+o[0])*U,f.y+(b[1]+o[1])*U]}

/* ---------- 오디오 ---------- */
let AC=null,buf={},musicSrc=null,musicT0=0,muted=false;const BPM=120,SPB=60/BPM;
async function audioInit(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();for(const n of['funk','boing','click','stretch']){try{const r=await fetch('sfx/'+n+'.mp3');buf[n]=await AC.decodeAudioData(await r.arrayBuffer())}catch(e){}}}
function sfx(n,{vol=.6,rate=1,dur=null}={}){if(!AC||!buf[n])return;const s=AC.createBufferSource();s.buffer=buf[n];s.playbackRate.value=rate;const gn=AC.createGain();gn.gain.value=vol;s.connect(gn);gn.connect(AC.destination);s.start(0,0,dur||undefined)}
function musicOn(){if(!AC||!buf.funk||musicSrc)return;const s=AC.createBufferSource();s.buffer=buf.funk;s.loop=true;const d=buf.funk.duration;s.loopStart=Math.max(0,d-32);s.loopEnd=d;const gn=AC.createGain();gn.gain.value=.55;s.connect(gn);gn.connect(AC.destination);s.start(0,Math.max(0,d-32));musicSrc=s;musicT0=AC.currentTime;$('music').classList.add('on')}
function musicOff(){if(musicSrc){try{musicSrc.stop()}catch(e){}musicSrc=null}$('music').classList.remove('on')}
function beatNow(){return musicSrc?(AC.currentTime-musicT0)/SPB:performance.now()/1000/SPB}

/* ---------- 명령줄 ---------- */
const hist=['',''];function cmd(line,cur){if(line){hist.shift();hist.push(line);$('h1').textContent=hist[0];$('h2').textContent=hist[1]}if(cur!=null)$('cur').textContent=cur}
let tipT=0;function tip(t){$('tip').textContent=t;$('tip').style.opacity=1;clearTimeout(tipT);tipT=setTimeout(()=>$('tip').style.opacity=0,2600)}

/* ---------- 입력 ---------- */
function hitJoint(x,y,r){let best=null,bd=r*r;for(const f of figs)for(const k of J){const[px,py]=P(f,k);const d=(px-x)**2+(py-y)**2;if(d<bd){bd=d;best=k}}return best}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
let auto=false,playing=false,recording=false,recData=[],recT0=0,lastSnd=0;
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);mouse={x,y,in:true,touch:e.pointerType!=='mouse'};
  if(auto)toggleAuto(false);if(playing)togglePlay(false);
  const rad=mouse.touch?24:12;const k=hitJoint(x,y,rad);
  if(k){if(!sel.has(k)){if(!e.shiftKey)sel.clear();sel.add(k);sfx('click',{vol:.5})}
    undoStack.push(JSON.stringify(off));if(undoStack.length>50)undoStack.shift();
    drag={x0:x,y0:y,start:JSON.parse(JSON.stringify(off)),moved:0,hot:k};cmd('명령: STRETCH',`신축 점 지정: (그립 ${sel.size}개)`);sfx('stretch',{vol:.35,dur:.35,rate:1.1});
    if(recording&&!recData.length)recT0=performance.now()}
  else{box={x0:x,y0:y,x1:x,y1:y};if(!e.shiftKey)sel.clear();cmd(null,'반대 구석 지정:')}});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);mouse.x=x;mouse.y=y;mouse.in=true;
  if(drag){const dx=(x-drag.x0)/U,dy=(y-drag.y0)/U;for(const k of sel){off[k]=[drag.start[k][0]+dx,drag.start[k][1]+dy]}drag.moved=Math.hypot(dx,dy);
    $('cur').textContent=`신축 점 지정:  @${(dx*100).toFixed(0)},${(-dy*100).toFixed(0)}`;
    if(AC&&drag.moved>.4&&performance.now()-lastSnd>260){lastSnd=performance.now();sfx('stretch',{vol:.18,dur:.18,rate:.9+Math.min(1.2,drag.moved*.25)})}}
  else if(box){box.x1=x;box.y1=y}
  else hover=hitJoint(x,y,mouse.touch?24:12)});
function endPtr(e){if(drag){if(drag.moved>1.1)sfx('boing',{vol:.55,rate:1+Math.random()*.3});cmd(`신축 점 지정: @${(drag.moved*100).toFixed(0)}`,'명령:');drag=null}
  else if(box){const x0=Math.min(box.x0,box.x1),x1=Math.max(box.x0,box.x1),y0=Math.min(box.y0,box.y1),y1=Math.max(box.y0,box.y1);
    if(x1-x0>4||y1-y0>4){const crossing=box.x1<box.x0;for(const f of figs)for(const k of J){const[px,py]=P(f,k);if(px>=x0&&px<=x1&&py>=y0&&py<=y1)sel.add(k)}
      cmd(`${crossing?'걸치기':'윈도우'} 선택: 관절 ${sel.size}종류 × ${count}명`,sel.size?'명령: 파란 그립을 잡아 끌면 신축(STRETCH)':'명령:');if(sel.size){sfx('click',{vol:.5});tip('파란 점을 잡아서 끌어보세요!')}}
    else cmd(null,'명령:');box=null}
  if(e&&e.pointerType!=='mouse')mouse.in=false}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);cv.addEventListener('pointerleave',()=>{if(!drag&&!box)mouse.in=false});
addEventListener('keydown',e=>{if(e.key==='Escape'){sel.clear();cmd('*취소*','명령:')}if((e.ctrlKey||e.metaKey)&&e.key==='z'){undo();e.preventDefault()}if(e.code==='Space'&&$('start').classList.contains('off')){e.preventDefault();$('music').click()}});
function undo(){const s=undoStack.pop();if(s){off=JSON.parse(s);cmd('명령: U  실행 취소','명령:')}}

/* ---------- 녹화 / 재생 ---------- */
function snapshot(){const o={};for(const k of J)o[k]=[off[k][0],off[k][1]];return o}
function toggleRec(on){recording=on??!recording;$('rec').classList.toggle('on',recording);
  if(recording){togglePlay(false);toggleAuto(false);recData=[];recT0=performance.now();recData.push({t:0,o:snapshot()});cmd('명령: RECORD 시작','관절을 움직여 춤을 만드세요… 다시 누르면 끝');musicOn()}
  else{if(recData.length>2){const L=recData[recData.length-1].t;// 박자 단위로 길이 맞추기
      const beats=Math.max(2,Math.round(L/1000/SPB));recData.len=beats*SPB*1000;cmd(`녹화 완료: ${beats}박`,'명령: ▶ 재생을 누르면 음악에 맞춰 반복');tip('▶ 재생으로 춤을 반복해보세요');}
    else cmd('녹화된 움직임이 없어요','명령:')}}
function togglePlay(on){playing=on??!playing;if(playing&&!(recData.length>2&&recData.len)){playing=false;tip('먼저 ● 녹화로 춤을 만들어주세요');}
  $('play').classList.toggle('on',playing);if(playing){toggleAuto(false);musicOn();cmd('명령: PLAY','반복 재생 중…')}}
function toggleAuto(on){auto=on??!auto;$('rand').classList.toggle('on',auto);if(auto){playing=false;$('play').classList.remove('on');musicOn();sel.clear();cmd('명령: AUTODANCE','박자에 맞춰 자동으로 춤춰요')}else target=null}

/* ---------- 자동 춤 포즈 (BASE 대비 오프셋) ---------- */
const POSES=[
 {lHand:[-.3,-1.5],rHand:[.3,-1.5],lElb:[-.1,-.6],rElb:[.1,-.6]},                         // 만세
 {lFoot:[-1.2,-.6],rFoot:[1.2,-.6],lKnee:[-.6,-.4],rKnee:[.6,-.4],hip:[0,.5],neck:[0,.5],head:[0,.5],lElb:[0,.5],rElb:[0,.5],lHand:[-.4,.2],rHand:[.4,.2]}, // 다리 찢기
 {rFoot:[1.4,-1.3],rKnee:[.7,-.6],lHand:[-.6,-.9],rHand:[.9,-1.2],rElb:[.3,-.3]},           // 발차기
 {head:[.7,.2],neck:[.5,.1],lElb:[.4,-.2],rElb:[.6,.1],lHand:[.2,-1.1],rHand:[1.2,-.5]},    // 기울기
 {head:[-.7,.2],neck:[-.5,.1],lElb:[-.6,.1],rElb:[-.4,-.2],lHand:[-1.2,-.5],rHand:[-.2,-1.1]},
 {lHand:[1.1,-.5],rHand:[1.6,-.2],lElb:[.6,-.3],rElb:[.9,-.1],lFoot:[-.4,0],rFoot:[.4,0]},  // 가리키기
 {head:[0,-1.2],neck:[0,-.8],lHand:[-1.4,-1.2],rHand:[1.4,-1.2],lElb:[-.6,-.6],rElb:[.6,-.6]}, // 목 늘이기 (CAD 신축)
 {lKnee:[-.5,-.2],rKnee:[.5,-.2],hip:[0,.35],lHand:[-.1,.4],rHand:[.1,.4],lElb:[-.3,.2],rElb:[.3,.2]}, // 쪼그려
 {lFoot:[2.2,-.1],rFoot:[2.8,-.1],lKnee:[1.1,0],rKnee:[1.4,0],lHand:[-1.6,.2],rHand:[-1.2,.5]},  // 쭉 늘어나기
];
let lastBeat=-1,poseIdx=0;
function autoStep(){const b=Math.floor(beatNow());if(b!==lastBeat){lastBeat=b;let n;do{n=Math.floor(Math.random()*POSES.length)}while(n===poseIdx);poseIdx=b%2?n:0===0&&b%4===0?6:n;
  const p=POSES[poseIdx];target={};for(const k of J)target[k]=p[k]?[...p[k]]:[0,0];if(b%4===0&&Math.random()<.35){for(const k of J)target[k]=[target[k][0]*1.4,target[k][1]*1.4]}}
  if(target){const a=.28;for(const k of J){off[k][0]+=(target[k][0]-off[k][0])*a;off[k][1]+=(target[k][1]-off[k][1])*a}}}

/* ---------- 그리기 ---------- */
function grid(){g.fillStyle='#212830';g.fillRect(0,0,W,H);const s=Math.max(12,U*.25);const ox=(W/2)%s,oy=(H/2)%s;
  g.lineWidth=1;g.strokeStyle='rgba(120,150,190,.10)';g.beginPath();for(let x=ox;x<W;x+=s){g.moveTo(x+.5,0);g.lineTo(x+.5,H)}for(let y=oy;y<H;y+=s){g.moveTo(0,y+.5);g.lineTo(W,y+.5)}g.stroke();
  g.strokeStyle='rgba(120,150,190,.22)';g.beginPath();for(let x=ox;x<W;x+=s*5){g.moveTo(x+.5,0);g.lineTo(x+.5,H)}for(let y=oy;y<H;y+=s*5){g.moveTo(0,y+.5);g.lineTo(W,y+.5)}g.stroke();
  // UCS 아이콘
  const ux=16,uy=H-16;g.strokeStyle='#c9d6e4';g.lineWidth=1.5;g.beginPath();g.moveTo(ux,uy);g.lineTo(ux+34,uy);g.moveTo(ux,uy);g.lineTo(ux,uy-34);g.stroke();
  g.fillStyle='#c9d6e4';g.font='10px "Share Tech Mono"';g.fillText('X',ux+37,uy+3);g.fillText('Y',ux-3,uy-38);g.strokeRect(ux-3,uy-3,6,6)}
function drawFig(f){const selBone=b=>sel.has(b[0])||sel.has(b[1]);
  for(const pass of[0,1]){for(const b of BONES){const s=selBone(b);if((pass===0)===s)continue;const[a1,a2]=P(f,b[0]),[c1,c2]=P(f,b[1]);g.setLineDash(s?[6,4]:[]);g.strokeStyle=s?'#9fd0ff':'#eef3f9';g.lineWidth=Math.max(1.4,U*.045);g.beginPath();g.moveTo(a1,a2);g.lineTo(c1,c2);g.stroke()}}
  g.setLineDash([]);
  // 머리: 목과 머리 사이 연결선 + 원 + 얼굴
  const[hx,hy]=P(f,'head'),[nx,ny]=P(f,'neck');const r=HEAD_R*U;const d=Math.hypot(hx-nx,hy-ny);const hs=sel.has('head');
  if(d>r){g.strokeStyle=sel.has('neck')||hs?'#9fd0ff':'#eef3f9';g.setLineDash(sel.has('neck')||hs?[6,4]:[]);g.beginPath();g.moveTo(nx,ny);g.lineTo(hx-(hx-nx)/d*r,hy-(hy-ny)/d*r);g.stroke();g.setLineDash([])}
  g.strokeStyle=hs?'#9fd0ff':'#eef3f9';g.setLineDash(hs?[6,4]:[]);g.beginPath();g.arc(hx,hy,r,0,7);g.stroke();g.setLineDash([]);
  g.fillStyle='#eef3f9';g.beginPath();g.arc(hx-r*.35,hy-r*.18,Math.max(1.2,r*.09),0,7);g.arc(hx+r*.35,hy-r*.18,Math.max(1.2,r*.09),0,7);g.fill();
  g.lineWidth=Math.max(1.2,U*.035);g.beginPath();g.arc(hx,hy+r*.05,r*.5,.2*Math.PI,.8*Math.PI);g.stroke();
  // 그립
  for(const k of J){const[px,py]=P(f,k);const s=Math.max(5,U*.13);
    if(sel.has(k)){g.fillStyle=(drag&&drag.hot===k)||(!drag&&hover===k)?'#ff3b4e':'#1e6fff';g.fillRect(px-s/2,py-s/2,s,s);g.strokeStyle='#cfe1ff';g.lineWidth=1;g.strokeRect(px-s/2,py-s/2,s,s)}
    else if(hover===k&&!drag&&!auto&&!playing){g.strokeStyle='#ffd23f';g.lineWidth=1.5;g.strokeRect(px-s/2,py-s/2,s,s)}}}
function crosshair(){if(!mouse.in||(mouse.touch&&!drag&&!box))return;const{x,y}=mouse;g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1;g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke();
  g.clearRect(x-5,y-5,10,10);g.fillStyle='#212830';g.fillRect(x-5,y-5,10,10);g.strokeRect(x-4.5,y-4.5,9,9)}
function drawBox(){if(!box)return;const crossing=box.x1<box.x0;const x=Math.min(box.x0,box.x1),y=Math.min(box.y0,box.y1),w=Math.abs(box.x1-box.x0),h=Math.abs(box.y1-box.y0);
  g.fillStyle=crossing?'rgba(60,200,90,.28)':'rgba(40,110,255,.28)';g.fillRect(x,y,w,h);g.strokeStyle=crossing?'#7cf08f':'#7fb0ff';g.setLineDash(crossing?[7,5]:[]);g.lineWidth=1.2;g.strokeRect(x+.5,y+.5,w,h);g.setLineDash([])}
function loop(){const now=performance.now();
  if(auto)autoStep();
  if(recording&&recData.length&&(drag||now-recT0-recData[recData.length-1].t>66))recData.push({t:now-recT0,o:snapshot()});
  if(playing&&recData.len){const t=((beatNow()*SPB*1000)%recData.len);let i=recData.findIndex(r=>r.t>t);if(i<0)i=recData.length-1;const a=recData[Math.max(0,i-1)],b=recData[i];const u=b.t>a.t?(t-a.t)/(b.t-a.t):0;
    for(const k of J){off[k]=[a.o[k][0]+(b.o[k][0]-a.o[k][0])*u,a.o[k][1]+(b.o[k][1]-a.o[k][1])*u]}}
  grid();for(const f of figs)drawFig(f);drawBox();crosshair();
  if(recording){g.fillStyle='#ff3b4e';g.beginPath();g.arc(W-22,20,7,0,7);g.fill();g.font='bold 12px "Share Tech Mono"';g.textAlign='right';g.fillText('REC '+((now-recT0)/1000).toFixed(1)+'s',W-34,24);g.textAlign='left'}
  requestAnimationFrame(loop)}

/* ---------- 버튼 ---------- */
$('go').onclick=async()=>{await audioInit();if(AC.state==='suspended')await AC.resume();$('start').classList.add('off');musicOn();cmd('AutoCAD 스타일 도면을 열었습니다: STRETCH.dwg','명령:');tip('관절을 드래그하거나, 빈 곳을 끌어서 박스로 선택하세요')};
$('music').onclick=async()=>{await audioInit();musicSrc?musicOff():musicOn()};
$('rec').onclick=async()=>{await audioInit();toggleRec()};
$('play').onclick=async()=>{await audioInit();if(recording)toggleRec(false);togglePlay()};
$('rand').onclick=async()=>{await audioInit();if(recording)toggleRec(false);toggleAuto()};
$('undo').onclick=undo;
$('reset').onclick=()=>{undoStack.push(JSON.stringify(off));toggleAuto(false);togglePlay(false);J.forEach(k=>off[k]=[0,0]);sel.clear();cmd('명령: RESET  원래 자세로','명령:');sfx('boing',{vol:.4,rate:.8})};
$('cnt').onclick=()=>{count=count===8?16:count===16?4:8;$('cnt').textContent=count+'명';layout();cmd(`명령: ARRAY  ${count}개`,'명령:')};
resize();loop();cmd('','명령:');
window.__app={off,sel,J,P:(i,k)=>P(figs[i],k),get figs(){return figs},toggleAuto,toggleRec,togglePlay,get recData(){return recData}};
</script>
