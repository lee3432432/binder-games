<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>돌리면 바뀌는 스케치 · 커맨드 플레이</title>
<meta name="description" content="사진 두 장을 올리면 하나의 스케치로 합쳐요. 화면을 돌리면 다른 그림이 나타나요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e7;--ink:#1b1b2f;--sub:#5b5b72;--yellow:#ffd23f;--pink:#ff6fae;--sky:#4cc9f0;--green:#7bd389;--orange:#ff9a3c;--blue:#2b2fa8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;
  background-image:radial-gradient(var(--sub) 1px,transparent 1px);background-size:22px 22px;background-position:-11px -11px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.logo{font-family:"Black Han Sans",sans-serif;font-size:28px;line-height:1}
.logo span{background:var(--yellow);padding:0 .15em;border:3px solid var(--ink);border-radius:10px;display:inline-block;transform:rotate(-2deg)}
.btn{border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:14px;border-radius:14px;padding:9px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:13px;padding:6px 11px;box-shadow:0 3px 0 var(--ink)}
.btn.y{background:var(--yellow)}.btn.p{background:var(--pink);color:#fff}.btn.s{background:var(--sky)}.btn.g{background:var(--green)}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:16px;margin-bottom:16px}
.card h2{font-size:18px;font-weight:900;margin-bottom:6px}
.card p{color:var(--sub);font-size:13px;line-height:1.6}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.drop{aspect-ratio:1;border:3px dashed var(--ink);border-radius:16px;display:grid;place-items:center;text-align:center;font-weight:900;cursor:pointer;overflow:hidden;position:relative;background:#faf6ea}
.drop img{width:100%;height:100%;object-fit:cover;display:block}
.drop .lbl{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-size:12px;padding:3px 8px;border-radius:8px}
.drop input{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
label.opt{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
input[type=range]{width:120px}
#stage{position:relative;aspect-ratio:1;background:#1b1b2f;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;touch-action:none;display:none}
#stage.on{display:block}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#stage canvas.drag{cursor:grabbing}
#deg{position:absolute;right:12px;top:10px;color:#fff;font-weight:900;font-family:"Black Han Sans",sans-serif;font-size:22px;text-shadow:0 2px 0 #000}
#hint{position:absolute;left:12px;bottom:10px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 0 #000}
.hide{display:none!important}
/* 명령어 바 */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:rgba(43,45,58,.94);border-radius:18px;padding:12px 12px 10px;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#q{width:100%;background:transparent;border:2px solid transparent;border-radius:10px;color:#fff;font:inherit;font-size:17px;font-weight:700;padding:6px 8px;outline:none}
#q:focus{border-color:#ffd23f}#q::placeholder{color:#a9abbb}
.brow{display:flex;align-items:center;gap:8px;margin-top:8px}
.ic{width:28px;height:28px;border-radius:50%;border:1.5px solid #8d90a3;color:#c9cbd8;display:grid;place-items:center;font-size:14px}
#send{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#2b2d3a;font-size:20px;font-weight:900;cursor:pointer}
#badge{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);font-family:"Black Han Sans",sans-serif;font-size:clamp(34px,7vw,64px);color:#ffd23f;-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:0 5px 0 #1b1b2f;white-space:nowrap;pointer-events:none;z-index:9;opacity:0}
#badge.show{animation:pop 1.4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1b1b2f;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.step{opacity:.35;pointer-events:none}.step.on{opacity:1;pointer-events:auto}
@media (max-width:480px){.drops{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">돌리면 바뀌는 <span>스케치</span></div><a class="btn sm" href="/">🏠</a></header>

  <div class="card step on" id="s1">
    <h2>1. 사진 두 장</h2><p>똑바로 봤을 때 보일 사진(A)과, 90° 돌리면 나타날 사진(B). 돌리는 동안 A가 사라지고 B가 나타나요. 얼굴이나 윤곽이 뚜렷한 사진이 잘 돼요.</p>
    <div class="drops">
      <label class="drop" id="dropA"><span class="lbl">A · 똑바로</span><span id="phA">📷 사진 A<br><small>누르거나 끌어다 놓기</small></span><input type="file" accept="image/*" id="fileA"></label>
      <label class="drop" id="dropB"><span class="lbl">B · 90° 돌리면</span><span id="phB">📷 사진 B<br><small>누르거나 끌어다 놓기</small></span><input type="file" accept="image/*" id="fileB"></label>
    </div>
    <div class="row"><button class="btn sm" id="sampleBtn">🎨 샘플 사진으로 해보기</button></div>
  </div>

  <div class="card step on" id="s2">
    <h2>2. 스케치 설정</h2>
    <div class="row">
      <label class="opt">선 굵기 <input type="range" id="edge" min="1" max="6" value="3"></label>
      <label class="opt">진하기 <input type="range" id="dark" min="20" max="100" value="60"></label>
      <label class="opt">B 비중 <input type="range" id="mix" min="20" max="80" value="50"></label>
    </div>
    <div class="row">
      <label class="opt">색 <select id="palette" style="font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:10px;padding:3px 8px"><option value="duo">주황 / 파랑 반반</option><option value="pencil">연필 (흑백)</option><option value="blue">파랑 단색</option><option value="orange">주황 단색</option></select></label>
      <label class="opt"><input type="checkbox" id="flipB"> B 방향 반대로 (-90°)</label>
    </div>
    <div class="row"><button class="btn y" id="makeBtn">✨ 스케치 합치기</button></div>
  </div>

  <div class="card step on" id="s3">
    <h2>3. 돌려보기</h2><p>그림을 끌어서 돌리거나 버튼으로 돌려요. 저장하면 사진 한 장으로 나와요.</p>
    <div id="stage"><canvas id="out"></canvas><div id="deg">0°</div><div id="hint">끌어서 돌려보세요 — 0° A, 90° B</div></div>
    <div class="row"><button class="btn s" id="rotL">↶ 90°</button><button class="btn s" id="rotR">↷ 90°</button><button class="btn p" id="spinBtn">🔄 자동 회전</button><button class="btn g" id="saveBtn">💾 저장</button><button class="btn sm" id="shareBtn">📤 공유</button></div>
  </div>
</div>

<div id="badge"></div><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const SIZE=1024;
let imgA=null,imgB=null,angle=0,spinT=null,result=null;
const st={photo:0,sketch:0,rotate:0,merge:0,color:0};
function badge(t){const b=$('badge');b.classList.remove('show');void b.offsetWidth;b.textContent=t;b.classList.add('show')}
let toastT;function toast(m,ms=2400){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
function step(n){$('s'+n).classList.add('on')}

/* ---------- 이미지 로드 ---------- */
function loadFile(file,which){const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{setImg(im,which);URL.revokeObjectURL(url)};im.src=url}
function setImg(im,which){const c=document.createElement('canvas');c.width=c.height=SIZE;const g=c.getContext('2d');const s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,SIZE,SIZE);
  if(which==='A'){imgA=c;$('phA').innerHTML='';const p=$('dropA').querySelector('img');if(p)p.remove();$('dropA').appendChild(Object.assign(new Image(),{src:c.toDataURL('image/jpeg',.7)}))}
  else{imgB=c;$('phB').innerHTML='';const p=$('dropB').querySelector('img');if(p)p.remove();$('dropB').appendChild(Object.assign(new Image(),{src:c.toDataURL('image/jpeg',.7)}))}
  if(imgA&&imgB){st.photo=1;step(2)}}
for(const w of['A','B']){$('file'+w).onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0],w)};const d=$('drop'+w);
  d.addEventListener('dragover',e=>{e.preventDefault();d.style.background='#ffe9a8'});d.addEventListener('dragleave',()=>d.style.background='');
  d.addEventListener('drop',e=>{e.preventDefault();d.style.background='';const f=e.dataTransfer.files[0];if(f)loadFile(f,w)})}
// 샘플: 코드로 그린 간단한 샘플(물고기/얼굴 실루엣)
function sample(){const mk=draw=>{const c=document.createElement('canvas');c.width=c.height=SIZE;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,SIZE,SIZE);draw(g);return c};
  const a=mk(g=>{g.fillStyle='#333';g.beginPath();g.ellipse(520,520,300,170,-.3,0,7);g.fill();g.beginPath();g.moveTo(760,440);g.lineTo(960,300);g.lineTo(930,560);g.closePath();g.fill();g.fillStyle='#fff';g.beginPath();g.arc(330,470,28,0,7);g.fill();g.strokeStyle='#333';g.lineWidth=6;for(let i=0;i<9;i++){g.beginPath();g.arc(420+i*40,560,70,2.6,3.9);g.stroke()}});
  const b=mk(g=>{g.fillStyle='#333';g.beginPath();g.arc(512,420,230,0,7);g.fill();g.fillRect(400,600,224,300);g.beginPath();g.ellipse(512,860,300,120,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(430,400,30,0,7);g.arc(600,400,30,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=10;g.beginPath();g.arc(512,470,80,.3,2.8);g.stroke();for(let i=0;i<7;i++){g.fillStyle='#333';g.beginPath();g.moveTo(300+i*70,230);g.lineTo(330+i*70,90);g.lineTo(370+i*70,230);g.fill()}});
  setImg(a,'A');setImg(b,'B');toast('샘플: A=물고기, B=얼굴')}
$('sampleBtn').onclick=sample;

/* ---------- 스케치 변환 (그레이 → 반전 블러 → 컬러닷지) ---------- */
function sketch(src,edge,dark){const w=SIZE,h=SIZE;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.drawImage(src,0,0);const d=g.getImageData(0,0,w,h);const p=d.data;const gray=new Float32Array(w*h);
  for(let i=0;i<w*h;i++){gray[i]=(p[i*4]*.3+p[i*4+1]*.59+p[i*4+2]*.11)}
  // 반전 + 블러(박스 블러 3회 ≈ 가우시안)
  let inv=new Float32Array(w*h);for(let i=0;i<w*h;i++)inv[i]=255-gray[i];
  const r=edge*2;const tmp=new Float32Array(w*h);
  const box=(srcA,dstA)=>{for(let y=0;y<h;y++){let acc=0;for(let x=-r;x<=r;x++)acc+=srcA[y*w+Math.min(w-1,Math.max(0,x))];for(let x=0;x<w;x++){dstA[y*w+x]=acc/(2*r+1);const a=x-r,b=x+r+1;acc+=srcA[y*w+Math.min(w-1,b)]-srcA[y*w+Math.max(0,a)]}}
    for(let x=0;x<w;x++){let acc=0;for(let y=-r;y<=r;y++)acc+=dstA[Math.min(h-1,Math.max(0,y))*w+x];for(let y=0;y<h;y++){srcA[y*w+x]=acc/(2*r+1);const a=y-r,b=y+r+1;acc+=dstA[Math.min(h-1,b)*w+x]-dstA[Math.max(0,a)*w+x]}}};
  box(inv,tmp);box(inv,tmp);
  // 컬러 닷지: gray/(255-blur)
  const out=new Float32Array(w*h);for(let i=0;i<w*h;i++){const b=inv[i];let v=b>=254?255:Math.min(255,gray[i]*256/(255-b));out[i]=v}
  // 진하기: 밝은 부분은 흰색으로, 선은 더 진하게 (감마)
  const k=dark/60;for(let i=0;i<w*h;i++){let v=out[i]/255;v=Math.pow(v,k*1.6);out[i]=v*255}
  return out}
/* ---------- 합치기 ---------- */
function rotateArr(a,ccw){const w=SIZE,h=SIZE;const o=new Float32Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){o[y*w+x]=ccw?a[(w-1-x)*w+y]:a[x*w+(h-1-y)]}return o}
let skA=null,skB=null;
function toCanvas(arr){const c=document.createElement('canvas');c.width=c.height=SIZE;const g=c.getContext('2d');const d=g.createImageData(SIZE,SIZE);for(let i=0;i<SIZE*SIZE;i++){const v=arr[i];d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255}g.putImageData(d,0,0);return c}
function merge(){if(!imgA||!imgB){toast('사진 두 장을 먼저 올려주세요');return}
  const edge=+$('edge').value,dark=+$('dark').value;
  skA=toCanvas(sketch(imgA,edge,dark));skB=toCanvas(sketch(imgB,edge,dark));
  result=true;$('stage').classList.add('on');step(3);setAngle(0);st.sketch=st.merge=st.color=1;badge('완성! 돌려보세요 🔄');$('stage').scrollIntoView({behavior:'smooth',block:'center'})}
const work=document.createElement('canvas');
function render(target,size,ang){if(!skA)return;target.width=target.height=size;const g=target.getContext('2d');work.width=work.height=size;const w=work.getContext('2d');
  const th=ang*Math.PI/180;const mix=+$('mix').value/100;// 0°=A, 90°=B
  const fa=Math.pow(Math.cos(th),2),fb=Math.pow(Math.sin(th),2);
  const wa=Math.min(1,fa*(1-mix)/.5),wb=Math.min(1,fb*mix/.5);const dirB=$('flipB').checked?-1:1;
  w.setTransform(1,0,0,1,0,0);w.globalCompositeOperation='source-over';w.globalAlpha=1;w.fillStyle='#fff';w.fillRect(0,0,size,size);
  const draw=(img,rot,alpha)=>{if(alpha<=0.005)return;w.save();w.translate(size/2,size/2);w.rotate(rot);w.globalCompositeOperation='multiply';w.globalAlpha=alpha;const sc=size/SIZE*0.78;w.drawImage(img,-SIZE*sc/2,-SIZE*sc/2,SIZE*sc,SIZE*sc);w.restore()};
  draw(skA,th,wa);draw(skB,th-dirB*Math.PI/2,wb);
  // 듀오톤(화면 기준 좌우 반반 고정)
  const d=w.getImageData(0,0,size,size);const px=d.data;const pal=$('palette').value;const OR=[255,154,60],BL=[43,47,168];
  for(let i=0;i<size*size;i++){const v=px[i*4]/255;const x=i%size;let col;
    if(pal==='pencil'){col=[v*255,v*255,v*255]}else if(pal==='blue'){col=[BL[0]+(255-BL[0])*v,BL[1]+(255-BL[1])*v,BL[2]+(255-BL[2])*v]}
    else if(pal==='orange'){col=[BL[0]+(OR[0]-BL[0])*v,BL[1]+(OR[1]-BL[1])*v,BL[2]+(OR[2]-BL[2])*v]}
    else{const left=x<size/2;const paper=left?OR:BL,ink=left?BL:OR;col=[ink[0]+(paper[0]-ink[0])*v,ink[1]+(paper[1]-ink[1])*v,ink[2]+(paper[2]-ink[2])*v]}
    px[i*4]=col[0];px[i*4+1]=col[1];px[i*4+2]=col[2]}
  g.putImageData(d,0,0);
  // 돌아가는 종이 테두리
  g.save();g.translate(size/2,size/2);g.rotate(th);g.strokeStyle='rgba(80,140,255,.9)';g.lineWidth=Math.max(2,size/300);const e=size*0.78;g.strokeRect(-e/2,-e/2,e,e);g.restore()}
$('makeBtn').onclick=merge;for(const id of['mix','palette','flipB'])$(id).addEventListener('input',()=>{if(skA)setAngle(angle)});

/* ---------- 회전 ---------- */
let raf=null;function setAngle(a){angle=a;$('deg').textContent=Math.round(((a%360)+360)%360)+'°';if(!raf)raf=requestAnimationFrame(()=>{raf=null;render($('out'),Math.min(640,$('stage').clientWidth*Math.min(2,devicePixelRatio)),angle)})}
$('rotL').onclick=()=>setAngle(Math.round(angle/90)*90-90);$('rotR').onclick=()=>setAngle(Math.round(angle/90)*90+90);
$('spinBtn').onclick=()=>{if(spinT){clearInterval(spinT);spinT=null;$('spinBtn').textContent='🔄 자동 회전';$('out').classList.remove('drag');return}
  $('out').classList.add('drag');let t=0;$('spinBtn').textContent='⏹ 멈춤';spinT=setInterval(()=>{t+=1/30;const ph=t%4;const e=ph<2?Math.min(1,ph):1-Math.min(1,ph-2);const ease=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;setAngle(ease*90)},1000/30)};
{const el=$('stage');let drag=false,a0=0,ang0=0;const ang=(e)=>{const r=el.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};
  el.addEventListener('pointerdown',e=>{if(spinT)$('spinBtn').click();drag=true;a0=ang(e);ang0=angle;$('out').classList.add('drag');el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(drag)setAngle(ang0+ang(e)-a0)});
  const up=()=>{if(!drag)return;drag=false;$('out').classList.remove('drag');const from=angle,to=Math.round(angle/90)*90;const t0=performance.now();const an=()=>{const k=Math.min(1,(performance.now()-t0)/250);setAngle(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(an)};an()};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
/* ---------- 저장 ---------- */
function exportBlob(){return new Promise(r=>{const c=document.createElement('canvas');render(c,SIZE,angle);c.toBlob(r,'image/png')})}
$('saveBtn').onclick=async()=>{if(!result)return;const b=await exportBlob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='spin_sketch.png';a.click();toast('저장했어요')};
$('shareBtn').onclick=async()=>{if(!result)return;const b=await exportBlob();const f=new File([b],'spin_sketch.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'돌리면 바뀌는 스케치'}).catch(()=>{});else toast('이 브라우저는 공유를 지원하지 않아요. 저장을 눌러주세요')};

/* ---------- 명령어 ---------- */
const CMDS=[
 {k:/사진|이미지|올려|업로드/,id:'photo',run:async()=>{step(1);badge('사진 올리기 📷');if(!imgA||!imgB){toast('A, B 칸을 눌러 사진을 올려주세요 (샘플 버튼도 있어요)')}}},
 {k:/스케치|연필|그림으로/,id:'sketch',need:'photo',run:async()=>{step(2);badge('스케치로 변환 ✏️');$('palette').value='pencil';merge()}},
 {k:/돌려|회전|90/,id:'rotate',need:'sketch',run:async()=>{badge('90° 회전 🔄');setAngle(Math.round(angle/90)*90+90)}},
 {k:/겹쳐|합쳐|포개/,id:'merge',need:'photo',run:async()=>{badge('두 장 겹치기 🪄');merge()}},
 {k:/색|주황|파랑|컬러/,id:'color',need:'sketch',run:async()=>{badge('주황 · 파랑 🎨');$('palette').value='duo';merge()}},
 {k:/자동|빙글/,id:'spin',need:'sketch',run:async()=>{if(!spinT)$('spinBtn').click()}},
 {k:/저장|다운/,id:'save',need:'sketch',run:async()=>{$('saveBtn').click()}},
];
async function handle(t){t=t.trim();if(!t)return;if(/처음|리셋|초기화/.test(t)){location.reload();return}
  const c=CMDS.find(c=>c.k.test(t));if(!c){toast('예: "사진 올려줘", "스케치로 바꿔줘", "겹쳐줘", "주황 파랑 색 입혀줘", "돌려줘"');return}
  if(c.need&&!st[c.need]&&!(c.need==='photo'&&imgA&&imgB)){toast(c.need==='photo'?'사진 두 장을 먼저 올려주세요':'스케치로 먼저 바꿔주세요');return}
  if(c.need==='photo')st.photo=1;await c.run();st[c.id]=1}

// 시작 상태: 명령어 버전은 1단계부터 잠김
window.__app={handle,st,merge,setImg,sample};
</script>
