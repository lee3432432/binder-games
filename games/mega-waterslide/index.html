<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>메가 워터슬라이드 · 커맨드 플레이</title>
<meta name="description" content="말 한마디로 워터슬라이드를 만들고 직접 타보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b2f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3a3d48;font-family:"Noto Sans KR",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
/* HUD */
.hud{position:fixed;top:10px;left:10px;display:flex;gap:8px;z-index:5}
.stat{min-width:58px;padding:4px 10px 6px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.stat small{display:block;font-size:11px;font-weight:700;opacity:.8}
.stat b{font-family:"Black Han Sans",sans-serif;font-size:24px;line-height:1}
#spd{background:#ffd23f}#cn{background:#3fd0c9}
.top-r{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
.btn{border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:13px;border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#prog{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(300px,34vw);height:12px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;z-index:5}
#prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ffd23f 0 10px,#4cc9f0 10px 20px)}
/* badge */
#badge{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);font-family:"Black Han Sans",sans-serif;font-size:clamp(34px,7vw,64px);color:#ffd23f;
  -webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:0 5px 0 #1b1b2f;white-space:nowrap;pointer-events:none;z-index:6;opacity:0}
#badge.show{animation:pop 1.4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
/* toast */
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1b1b2f;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:7;max-width:92vw;text-align:center}
#toast.on{opacity:1}
/* prompt */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:rgba(43,45,58,.94);border-radius:18px;padding:12px 12px 10px;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#bar form{display:block}
#q{width:100%;background:transparent;border:2px solid transparent;border-radius:10px;color:#fff;font:inherit;font-size:17px;font-weight:700;padding:6px 8px;outline:none}
#q:focus{border-color:#ffd23f}
#q::placeholder{color:#a9abbb}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.ic{width:28px;height:28px;border-radius:50%;border:1.5px solid #8d90a3;color:#c9cbd8;display:grid;place-items:center;font-size:14px}
#send{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#2b2d3a;font-size:20px;font-weight:900;cursor:pointer}
#send:disabled{opacity:.35}
/* result */
#result{position:fixed;inset:0;display:none;place-items:center;z-index:9;background:rgba(10,20,40,.35)}
#result.on{display:grid}
.card{background:#fff8e7;border:4px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:22px 26px;text-align:center;width:min(340px,90vw)}
.card h2{font-family:"Black Han Sans",sans-serif;font-size:40px;color:#ff6fae;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.card ul{list-style:none;margin:14px 0 18px;font-weight:700;color:var(--ink);line-height:1.9}
.card ul b{font-family:"Black Han Sans",sans-serif;font-size:20px}
.card .btn{font-size:16px;padding:10px 18px;margin:4px}
#hint{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);color:#fff;font-weight:900;text-shadow:0 2px 0 #1b1b2f;font-size:14px;opacity:0;transition:opacity .3s;z-index:5;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
@media (max-width:520px){.stat b{font-size:20px}.btn{font-size:12px;padding:5px 9px}#prog{top:60px;width:60vw}}

#start{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:rgba(0,0,0,.35)}
#start.off{display:none}
#start .box{text-align:center}
#start h1{font-family:"Black Han Sans",sans-serif;font-size:clamp(40px,9vw,80px);color:#fff;-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:0 6px 0 #1b1b2f;margin-bottom:18px}
#start p{color:#fff;font-weight:700;text-shadow:0 2px 0 #1b1b2f;margin-bottom:22px;font-size:15px}
#go{font-family:"Black Han Sans",sans-serif;font-size:34px;padding:12px 44px;border-radius:999px;border:4px solid #1b1b2f;background:#ffd23f;color:#1b1b2f;box-shadow:0 6px 0 #1b1b2f;cursor:pointer}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #1b1b2f}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div class="hud"><div class="stat" id="spd"><small>속도 km/h</small><b id="spdv">0</b></div><div class="stat" id="cn"><small>코인</small><b id="cnv">0</b></div></div>
<div id="prog"><i id="progi"></i></div>
<div class="top-r"><a class="btn" href="/" title="게임 목록">🏠</a><button class="btn" id="demo">자동 데모</button><button class="btn" id="snd">소리 꺼짐</button></div>
<div id="badge"></div>
<div id="toast"></div>
<div id="hint">← → 또는 화면을 좌우로 드래그해서 코인을 모으세요</div>
<div id="bar"><form id="f" autocomplete="off"><input id="q" placeholder="무엇을 만들까요?" maxlength="40" enterkeyhint="send"></form>
  <div class="row"><span class="ic">+</span><span class="ic">✎</span><button id="send" form="f" type="submit" aria-label="보내기">↑</button></div></div>
<div id="start"><div class="box"><h1>메가 워터슬라이드</h1><p>← → 키 또는 화면을 좌우로 드래그해 코인을 모으세요<br>커브에서는 원심력에 밀려요 — 가장자리로 넘어가면 추락!<br>🔴 빨간 범퍼에 부딪히면 속도가 반으로 줄어요</p><button id="go">출발!</button></div></div>
<div id="result"><div class="card"><h2 id="rt">정중앙!!</h2><ul id="rl"></ul><button class="btn" id="again">다시 타기</button><button class="btn" id="reset">처음부터</button></div></div>

<script type="module">
import * as THREE from './three.module.min.js';

/* ---------- 기본 ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const BG_EMPTY=new THREE.Color(0x3a3d48);
scene.background=BG_EMPTY.clone();
const camera=new THREE.PerspectiveCamera(55,1,0.1,4000);
const hemi=new THREE.HemisphereLight(0xffffff,0x8a8f99,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(120,200,-80);scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?70:55;camera.updateProjectionMatrix();fxc.width=w*devicePixelRatio;fxc.height=h*devicePixelRatio}
const fxc=document.getElementById('fx'),fx=fxc.getContext('2d');
addEventListener('resize',resize);resize();

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const tweens=[];
function tween(dur,fn){return new Promise(res=>tweens.push({t0:performance.now(),dur,fn,res}))}

/* ---------- 캔버스 텍스처 ---------- */
function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}return t}
const checkerTex=canvasTex(256,256,(g,w,h)=>{for(let y=0;y<2;y++)for(let x=0;x<2;x++){g.fillStyle=(x+y)%2?'#9a9ea8':'#b9bdc6';g.fillRect(x*128,y*128,128,128)}},[400,400]);
const grassTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#6fbf3a';g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){const l=rand(35,58);g.fillStyle=`hsl(${rand(85,105)},${rand(45,65)}%,${l}%)`;g.fillRect(rand(0,w),rand(0,h),rand(1,3),rand(2,5))}},[220,220]);
const skyTex=canvasTex(2048,1024,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2f8be6');gr.addColorStop(.42,'#7cc3ff');gr.addColorStop(.5,'#d9efff');gr.addColorStop(1,'#d9efff');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.95)';for(let i=0;i<60;i++){const x=rand(0,w),y=rand(h*.12,h*.44),s=rand(20,60);for(let k=0;k<7;k++){g.beginPath();g.ellipse(x+rand(-2.2,2.2)*s,y+rand(-.4,.4)*s,s*rand(.8,1.6),s*rand(.5,.9),0,0,7);g.fill()}}});
const stripeTex=canvasTex(64,512,(g,w,h)=>{const cols=['#ffcc1f','#ffffff','#1e5fd6','#34c3e8','#ffffff','#ffcc1f','#2a7de1','#9ae6f5'];const s=h/cols.length;cols.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*s,w,s)})},[1,1]);
const waterTex=canvasTex(128,256,(g,w,h)=>{g.fillStyle='rgba(120,220,255,.55)';g.fillRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;for(let i=0;i<40;i++){const x=rand(0,w),y=rand(0,h);g.beginPath();g.moveTo(x,y);g.lineTo(x+rand(-4,4),y+rand(12,30));g.stroke()}},[1,1]);
const poolTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#3fc4ec';g.fillRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;for(let i=0;i<70;i++){g.beginPath();const x=rand(0,w),y=rand(0,h);g.arc(x,y,rand(6,16),rand(0,3),rand(3,6));g.stroke()}},[3,3]);
const starTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.lineWidth=16;g.strokeStyle='#1b1b2f';g.beginPath();g.ellipse(128,128,96,96,0,0,7);g.stroke();
  g.fillStyle='#1b1b2f';g.beginPath();for(let i=0;i<10;i++){const r=i%2?28:62,a=-Math.PI/2+i*Math.PI/5;g.lineTo(128+r*Math.cos(a),128+r*Math.sin(a))}g.fill()});

/* ---------- 바닥 & 시작 발판 ---------- */
const groundMat=new THREE.MeshLambertMaterial({map:checkerTex});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);
const pad=new THREE.Mesh(new THREE.BoxGeometry(6,.5,6),[new THREE.MeshLambertMaterial({color:0xdde3e0}),new THREE.MeshLambertMaterial({color:0xdde3e0}),new THREE.MeshLambertMaterial({map:starTex}),new THREE.MeshLambertMaterial({color:0xdde3e0}),new THREE.MeshLambertMaterial({color:0xdde3e0}),new THREE.MeshLambertMaterial({color:0xdde3e0})]);
pad.position.set(0,.25,0);scene.add(pad);

/* ---------- 슬라이드 경로 ---------- */
const pts=[];
const HR=28,TOP=122,HELIX_END=55,TURNS=2.25;
for(let i=0;i<=60;i++){const t=i/60,th=t*TURNS*Math.PI*2;pts.push(new THREE.Vector3(HR*Math.cos(th),TOP-(TOP-HELIX_END)*t,HR*Math.sin(th)))}
[[-20,50,46],[-16,44,76],[10,38,106],[26,32,136],[10,26,166],[-16,20,196],[-10,14,226],[0,9.5,250],[0,7,266],[0,7.6,280]].forEach(p=>pts.push(new THREE.Vector3(...p)));
const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.5);
const NS=1400;const L=curve.getLength();
const SP=[],ST=[],SB=[],SN=[];
for(let i=0;i<=NS;i++){const u=i/NS;const p=curve.getPointAt(u),t=curve.getTangentAt(u).normalize();
  const b=new THREE.Vector3().crossVectors(t,new THREE.Vector3(0,1,0)).normalize();const n=new THREE.Vector3().crossVectors(b,t).normalize();SP.push(p);ST.push(t);SB.push(b);SN.push(n)}
function frameAt(s){const f=Math.max(0,Math.min(NS,s/L*NS));const i=Math.min(NS-1,Math.floor(f)),k=f-i;
  const lerp=(A)=>A[i].clone().lerp(A[i+1],k);return{p:lerp(SP),t:lerp(ST).normalize(),b:lerp(SB).normalize(),n:lerp(SN).normalize()}}
const R=2.4;
function halfPipe(rad,a0,a1,segA,vRep,mat){const pos=[],uv=[],idx=[];
  for(let i=0;i<=NS;i++){for(let j=0;j<=segA;j++){const a=a0+(a1-a0)*j/segA;const p=SP[i].clone().addScaledVector(SB[i],rad*Math.sin(a)).addScaledVector(SN[i],-rad*Math.cos(a));pos.push(p.x,p.y,p.z);uv.push(j/segA,i/NS*vRep)}}
  for(let i=0;i<NS;i++)for(let j=0;j<segA;j++){const a=i*(segA+1)+j,b=a+segA+1;idx.push(a,b,a+1,b,b+1,a+1)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.userData.full=idx.length;m.userData.seg=segA;return m}
const slideMat=new THREE.MeshStandardMaterial({map:stripeTex,side:THREE.DoubleSide,roughness:.35,metalness:.05});
stripeTex.repeat.set(1,1);
const slide=halfPipe(R,-1.9,1.9,22,L/14,slideMat);slide.visible=false;scene.add(slide);
const waterMesh=halfPipe(R-.08,-1.15,1.15,14,L/8,new THREE.MeshBasicMaterial({map:waterTex,transparent:true,depthWrite:false,side:THREE.DoubleSide}));waterMesh.visible=false;scene.add(waterMesh);
// 기둥
const pillarGroup=new THREE.Group();pillarGroup.visible=false;scene.add(pillarGroup);
const pillarMat=new THREE.MeshLambertMaterial({color:0xb7bec8});
for(let i=10;i<NS-20;i+=14){const p=SP[i].clone().addScaledVector(SN[i],-R);if(p.y<3)continue;const h=p.y;
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,h,6),pillarMat);c.position.set(p.x,h/2,p.z);c.userData.h=h;pillarGroup.add(c)}
// 출발 탑
const tower=new THREE.Group();tower.visible=false;scene.add(tower);
{const top=SP[0].clone().addScaledVector(SN[0],-R);
 const col=new THREE.Mesh(new THREE.CylinderGeometry(2.2,3,top.y,12),new THREE.MeshLambertMaterial({color:0xf2f2f2}));col.position.set(top.x-ST[0].x*5,top.y/2,top.z-ST[0].z*5);tower.add(col);
 const plat=new THREE.Mesh(new THREE.CylinderGeometry(6,6,1.2,16),new THREE.MeshLambertMaterial({color:0xffffff}));plat.position.set(col.position.x,top.y-.6,col.position.z);tower.add(plat);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(7,5,16),new THREE.MeshLambertMaterial({color:0xff6fae}));roof.position.set(col.position.x,top.y+8,col.position.z);tower.add(roof);
 for(let k=0;k<4;k++){const a=k*Math.PI/2+.6;const pole=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,8,6),pillarMat);pole.position.set(col.position.x+5*Math.cos(a),top.y+4,col.position.z+5*Math.sin(a));tower.add(pole)}}

/* ---------- 하늘 ---------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(2500,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false,transparent:true,opacity:0}));sky.visible=false;scene.add(sky);
const hills=new THREE.Group();hills.visible=false;scene.add(hills);
{const hm=new THREE.MeshLambertMaterial({color:0x4fa03a});for(let i=0;i<16;i++){const a=i/16*Math.PI*2+rand(-.15,.15),d=rand(650,1000);const h=new THREE.Mesh(new THREE.SphereGeometry(1,20,12),hm);h.scale.set(rand(90,200),rand(25,55),rand(90,180));h.position.set(Math.cos(a)*d,-5,Math.sin(a)*d+150);hills.add(h)}}

/* ---------- 호수 ---------- */
const lakes=new THREE.Group();lakes.visible=false;scene.add(lakes);
{const lm=new THREE.MeshLambertMaterial({color:0x2f9df0});const spots=[[-70,40],[60,-30],[80,120],[-80,170],[70,230],[-60,290],[-130,-60],[140,40],[-150,110],[150,200],[40,-110],[-40,-120]];
 spots.forEach(([x,z])=>{const m=new THREE.Mesh(new THREE.CircleGeometry(1,32),lm);m.rotation.x=-Math.PI/2;m.scale.set(rand(10,22),rand(7,15),1);m.rotation.z=rand(0,3);m.position.set(x,.06,z);m.userData.s=m.scale.clone();lakes.add(m)})}

/* ---------- 나무 ---------- */
const TREE_N=260;
const trunkM=new THREE.InstancedMesh(new THREE.CylinderGeometry(.4,.6,3,6),new THREE.MeshLambertMaterial({color:0x8b5a2b}),TREE_N);
const leafM=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.6,1),new THREE.MeshLambertMaterial({color:0x3f9a35}),TREE_N);
trunkM.visible=leafM.visible=false;scene.add(trunkM,leafM);
const treeData=[];
{let tries=0;while(treeData.length<TREE_N&&tries<20000){tries++;const x=rand(-260,260),z=rand(-200,460);
  if(Math.hypot(x,z)<12)continue;let ok=true;for(let i=0;i<=NS;i+=20){if(Math.hypot(SP[i].x-x,SP[i].z-z)<9){ok=false;break}}if(!ok)continue;
  if(Math.abs(x)<30&&z>285&&z<380)continue;treeData.push({x,z,s:rand(.8,1.6),d:Math.hypot(x,z)})}
 treeData.sort((a,b)=>a.d-b.d)}
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_s=new THREE.Vector3(),_p=new THREE.Vector3();
function setTrees(k){treeData.forEach((t,i)=>{const g=Math.max(0,Math.min(1,k*1.6-i/treeData.length*.6));const e=g<1?Math.sin(g*Math.PI/2)*(1+.25*Math.sin(g*Math.PI)):1;const s=t.s*e+1e-4;
  _s.set(s,s,s);_p.set(t.x,1.5*s,t.z);_m.compose(_p,_q,_s);trunkM.setMatrixAt(i,_m);_p.set(t.x,(3+2)*s,t.z);_m.compose(_p,_q,_s);leafM.setMatrixAt(i,_m)});trunkM.instanceMatrix.needsUpdate=leafM.instanceMatrix.needsUpdate=true}
setTrees(0);

/* ---------- 라이더 ---------- */
const rider=new THREE.Group();rider.visible=false;scene.add(rider);
{const skin=new THREE.MeshLambertMaterial({color:0xf2b48a}),pink=new THREE.MeshLambertMaterial({color:0xff4fa0});
 const cap=(r,l,m)=>new THREE.Mesh(new THREE.CapsuleGeometry(r,l,4,10),m);
 // 몸의 길이 방향 = +Z(발이 앞), 등 = -Y
 const torso=cap(.62,1.1,skin);torso.rotation.x=Math.PI/2;torso.position.set(0,.62,-.2);rider.add(torso);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(.68,16,12),skin);belly.scale.set(1,.85,1.1);belly.position.set(0,.7,.1);rider.add(belly);
 const shorts=new THREE.Mesh(new THREE.CylinderGeometry(.66,.62,.6,16),pink);shorts.rotation.x=Math.PI/2;shorts.position.set(0,.62,.75);rider.add(shorts);

    ride.v+=(-PHY.g*f.t.y-PHY.mu*PHY.g-PHY.steer*ride.a*ride.a*PHY.g-PHY.drag*ride.v*ride.v)*dt;ride.v=Math.max(4,ride.v);ride.s+=ride.v*dt;
    const {up}=placeRider(Math.min(ride.s,L),ride.a);
    for(const c of coins){if(!c.got&&Math.abs(c.s-ride.s)<1.6&&Math.abs(c.a-ride.a)<.28){c.got=true;c.m.visible=false;coinsGot++;$('cnv').textContent=coinsGot;sfxCoin()}}
    const kmh=ride.v*3.6;maxSpd=Math.max(maxSpd,kmh);$('spdv').textContent=Math.round(kmh);$('progi').style.width=(ride.s/L*100)+'%';
    if(windGain){windGain.gain.value=Math.min(.35,ride.v/140);windFilt.frequency.value=500+ride.v*35}
    chaseP.copy(rider.position).addScaledVector(f.t,-9).addScaledVector(up,2.2).add(new THREE.Vector3(0,2.2,0));chaseL.copy(rider.position).addScaledVector(f.t,12);
    camera.position.lerp(chaseP,1-Math.pow(.0005,dt));camLook.lerp(chaseL,1-Math.pow(.0005,dt));camera.lookAt(camLook);
    if(ride.s>=L){ride.phase='air';ride.vel.copy(f.t).multiplyScalar(ride.v);ride.vel.y+=3;badge('점프! 🤸')}}
  else if(ride.phase==='air'){ride.vel.y-=PHY.g*dt;rider.position.addScaledVector(ride.vel,dt);rider.rotateX(-1.2*dt);
    chaseL.copy(rider.position);chaseP.copy(rider.position).add(new THREE.Vector3(0,9,0)).addScaledVector(new THREE.Vector3(ride.vel.x,0,ride.vel.z).normalize(),-14);
    camera.position.lerp(chaseP,1-Math.pow(.002,dt));camLook.lerp(chaseL,1-Math.pow(.002,dt));camera.lookAt(camLook);
    const inPool=pool.visible&&Math.abs(rider.position.x-POOL.x)<POOL.w/2&&Math.abs(rider.position.z-POOL.z)<POOL.l/2;
    if(rider.position.y<=(inPool?1.05:.6)){rider.position.y=inPool?1.05:.6;finish(inPool)}}}
function finish(inPool){ride.phase='done';windStop();$('spdv').textContent=0;
  const dist=Math.hypot(rider.position.x-POOL.x,rider.position.z-POOL.z);let title,bonus=0;
  if(ride.flung){title='슬라이드 밖으로 추락 😵'}else if(!pool.visible){title='수영장이 없어요 😅'}else if(!inPool){title='수영장 밖! 😵'}else if(dist<3.3){title='정중앙!!';bonus=100}else if(dist<7){title='나이스!';bonus=50}else{title='풍덩!';bonus=10}
  if(inPool){splashFx();sfxSplash()}badge(title);if(bonus>=50){burst(true,'#ff6fae');setTimeout(sfxWin,300)}
  const score=coinsGot*10+bonus;
  setTimeout(()=>{$('rt').textContent=title;$('rl').innerHTML=`<li>최고 속도 <b>${Math.round(maxSpd)}</b> km/h</li><li>코인 <b>${coinsGot}</b> / ${COIN_N}</li><li>착지 보너스 <b>${bonus}</b></li><li>총점 <b>${score}</b></li>`;$('result').classList.add('on');busy=false;$('send').disabled=false},1800);
  camTo(rider.position.clone().add(new THREE.Vector3(18,14,-18)),rider.position.clone(),1600)}
$('again').onclick=()=>{audio();startRide()};$('reset').onclick=()=>location.reload();

/* ---------- 자동 데모 ---------- */
const DEMO=['하늘 만들어줘','잔디 깔아줘','호수 파줘','나무 심어줘','워터슬라이드 세워줘','물 흘려줘','사람 태워줘','코인 뿌려줘','수영장 놔줘','효과음 넣어줘','출발'];
async function typeAndSend(text){const q=$('q');q.value='';q.focus({preventScroll:true});for(const ch of text){q.value+=ch;sfxType();await sleep(rand(70,130))}await sleep(350);q.value='';await handle(text)}
$('demo').onclick=async()=>{audio();if(demoRunning)return;demoRunning=true;$('demo').textContent='데모 중…';
  for(const cmd of DEMO){const id=(CMDS.find(c=>c.k.test(cmd))||{}).id;if(id&&st[id])continue;if(cmd==='출발'&&ride.phase==='done')break;await typeAndSend(cmd);while(busy&&ride.phase!=='ride')await sleep(100);await sleep(500)}
  while(ride.phase==='ride'||ride.phase==='air')await sleep(200);demoRunning=false;$('demo').textContent='자동 데모';$('q').blur()};

/* ---------- 루프 ---------- */
let last=performance.now();const TS=+new URLSearchParams(location.search).get('ts')||1;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];const k=Math.min(1,(now-t.t0)/t.dur);t.fn(k);if(k>=1){tweens.splice(i,1);t.res()}}
  if(waterMesh.visible)waterTex.offset.y-=dt*2.2;if(pool.visible)poolTex.offset.x+=dt*.03;
  if(coinGroup.visible)coins.forEach(c=>{if(c.m.visible)c.m.rotateZ(dt*3)});
  // 시작 전 살짝 둘러보기(흔들림 없이 천천히 고정 각도)
  {const d2=dt*TS,n=Math.ceil(d2/(1/60));for(let i=0;i<n;i++)updateRide(d2/n)}
  renderer.render(scene,camera);drawFx(now);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__game={handle,st,ride,L,landing,POOL,bursts};
/* ---------- 완성 버전: 처음부터 다 만들어진 상태 ---------- */
sky.visible=true;sky.material.opacity=1;scene.background.set(0xd9efff);scene.fog=new THREE.Fog(0xd9efff,350,1800);
groundMat.map=grassTex;groundMat.needsUpdate=true;hills.visible=true;lakes.visible=true;trunkM.visible=leafM.visible=true;setTrees(1);
bumpGroup.visible=true;slide.visible=tower.visible=pillarGroup.visible=true;slide.geometry.setDrawRange(0,slide.userData.full);
waterMesh.visible=true;waterMesh.geometry.setDrawRange(0,waterMesh.userData.full);
rider.visible=true;placeRider(0,0);coinGroup.visible=true;pool.visible=true;
Object.assign(st,{sky:1,grass:1,lake:1,tree:1,slide:1,water:1,rider:1,coin:1,pool:1});
{const f=frameAt(1);camera.position.copy(f.p.clone().addScaledVector(f.t,9).addScaledVector(f.b,-2.5).add(new THREE.Vector3(0,3.2,0)));camLook.copy(rider.position);camera.lookAt(camLook)}
$("bar").style.display="none";$("demo").style.display="none";
$("go").onclick=()=>{audio();setSound(true);$("start").classList.add("off");startRide()};
$("reset").onclick=()=>{$("result").classList.remove("on");$("start").classList.remove("off")};
</script>
</body>
