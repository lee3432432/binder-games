<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>야경 스카이슬라이드 · 커맨드 플레이</title>
<meta name="description" content="300m 빌딩 옥상에서 출발하는 네온 투명 워터슬라이드. 말 한마디로 만들고 1인칭으로 내려가세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0d1a;--neon:#39d5ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0d1a;font-family:"Noto Sans KR",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);opacity:0;transition:opacity .5s}
.hud{position:fixed;top:10px;left:10px;display:flex;gap:8px;z-index:5}
.stat{min-width:58px;padding:4px 10px 6px;border:2px solid var(--neon);border-radius:12px;color:#fff;background:rgba(8,12,30,.75);box-shadow:0 0 12px rgba(57,213,255,.5)}
.stat small{display:block;font-size:11px;font-weight:700;opacity:.8}
.stat b{font-family:"Black Han Sans",sans-serif;font-size:24px;line-height:1;color:var(--neon);text-shadow:0 0 8px var(--neon)}
.top-r{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
.btn{border:2px solid var(--neon);background:rgba(8,12,30,.8);color:#fff;font:inherit;font-weight:900;font-size:13px;border-radius:12px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;box-shadow:0 0 10px rgba(57,213,255,.35)}
.btn:active{transform:translateY(1px)}
#prog{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(300px,34vw);height:10px;border:2px solid var(--neon);border-radius:99px;background:rgba(8,12,30,.7);overflow:hidden;z-index:5}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39d5ff,#b14cff);box-shadow:0 0 10px var(--neon)}
#badge{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);font-family:"Black Han Sans",sans-serif;font-size:clamp(34px,7vw,64px);color:#fff;
  text-shadow:0 0 10px var(--neon),0 0 30px var(--neon),0 0 60px #2a7dff;white-space:nowrap;pointer-events:none;z-index:6;opacity:0}
#badge.show{animation:pop 1.4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(8,12,30,.92);border:1px solid var(--neon);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:7;max-width:92vw;text-align:center}
#toast.on{opacity:1}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:rgba(20,22,36,.94);border-radius:18px;padding:12px 12px 10px;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#q{width:100%;background:transparent;border:2px solid transparent;border-radius:10px;color:#fff;font:inherit;font-size:17px;font-weight:700;padding:6px 8px;outline:none}
#q:focus{border-color:var(--neon)}
#q::placeholder{color:#8f93a8}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.ic{width:28px;height:28px;border-radius:50%;border:1.5px solid #6d7189;color:#c9cbd8;display:grid;place-items:center;font-size:14px}
#send{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#2b2d3a;font-size:20px;font-weight:900;cursor:pointer}
#send:disabled{opacity:.35}
#result{position:fixed;inset:0;display:none;place-items:center;z-index:9;background:rgba(5,8,20,.5)}
#result.on{display:grid}
.card{background:#10142a;border:2px solid var(--neon);border-radius:22px;box-shadow:0 0 30px rgba(57,213,255,.5);padding:22px 26px;text-align:center;width:min(340px,90vw);color:#fff}
.card h2{font-family:"Black Han Sans",sans-serif;font-size:40px;color:#fff;text-shadow:0 0 12px var(--neon),0 0 30px var(--neon)}
.card ul{list-style:none;margin:14px 0 18px;font-weight:700;line-height:1.9}
.card ul b{font-family:"Black Han Sans",sans-serif;font-size:20px;color:var(--neon)}
.card .btn{font-size:16px;padding:10px 18px;margin:4px}
#hint{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);color:#fff;font-weight:900;text-shadow:0 0 8px var(--neon);font-size:14px;opacity:0;transition:opacity .3s;z-index:5;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
@media (max-width:520px){.stat b{font-size:20px}.btn{font-size:12px;padding:5px 9px}#prog{top:60px;width:60vw}}

#start{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:rgba(0,0,0,.35)}
#start.off{display:none}
#start .box{text-align:center}
#start h1{font-family:"Black Han Sans",sans-serif;font-size:clamp(40px,9vw,80px);color:#fff;-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:0 6px 0 #1b1b2f;margin-bottom:18px}
#start p{color:#fff;font-weight:700;text-shadow:0 2px 0 #1b1b2f;margin-bottom:22px;font-size:15px}
#go{font-family:"Black Han Sans",sans-serif;font-size:34px;padding:12px 44px;border-radius:999px;border:4px solid #1b1b2f;background:#ffd23f;color:#1b1b2f;box-shadow:0 6px 0 #1b1b2f;cursor:pointer}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #1b1b2f}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div class="hud"><div class="stat"><small>속도 km/h</small><b id="spdv">0</b></div><div class="stat"><small>코인</small><b id="cnv">0</b></div><div class="stat"><small>높이 m</small><b id="altv">0</b></div></div>
<div id="prog"><i id="progi"></i></div>
<div class="top-r"><a class="btn" href="/" title="게임 목록">🏠</a><button class="btn" id="demo">자동 데모</button><button class="btn" id="snd">소리 꺼짐</button></div>
<div id="badge"></div>
<div id="toast"></div>
<div id="hint">← → 또는 화면을 좌우로 드래그해서 코인을 모으세요</div>
<div id="bar"><form id="f" autocomplete="off"><input id="q" placeholder="무엇을 만들까요?" maxlength="40" enterkeyhint="send"></form>
  <div class="row"><span class="ic">+</span><span class="ic">✎</span><button id="send" form="f" type="submit" aria-label="보내기">↑</button></div></div>
<div id="start"><div class="box"><h1>야경 스카이슬라이드</h1><p>← → 키 또는 화면을 좌우로 드래그해 코인을 모으고<br>수영장 정중앙에 착지하세요</p><button id="go">출발!</button></div></div>
<div id="result"><div class="card"><h2 id="rt">정중앙!!</h2><ul id="rl"></ul><button class="btn" id="again">다시 타기</button><button class="btn" id="reset">처음부터</button></div></div>

<script type="module">
import * as THREE from '../mega-waterslide/three.module.min.js';

/* ---------- 기본 ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const BG_EMPTY=new THREE.Color(0x3a3d48),BG_NIGHT=new THREE.Color(0x070a18);
scene.background=BG_EMPTY.clone();
const camera=new THREE.PerspectiveCamera(60,1,0.1,6000);
const hemi=new THREE.HemisphereLight(0xffffff,0x8a8f99,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(120,200,-80);scene.add(sun);
const moon=new THREE.DirectionalLight(0x8fb4ff,0);moon.position.set(-200,300,100);scene.add(moon);
const fxc=document.getElementById('fx'),fx=fxc.getContext('2d');
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();fxc.width=w*devicePixelRatio;fxc.height=h*devicePixelRatio}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const tweens=[];
function tween(dur,fn){return new Promise(res=>tweens.push({t0:performance.now(),dur,fn,res}))}
const loader=new THREE.TextureLoader();
function loadTex(url,repeat){const t=loader.load(url);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat)}return t}
function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}return t}
const checkerTex=canvasTex(256,256,(g)=>{for(let y=0;y<2;y++)for(let x=0;x<2;x++){g.fillStyle=(x+y)%2?'#9a9ea8':'#b9bdc6';g.fillRect(x*128,y*128,128,128)}},[400,400]);
const starTex=canvasTex(256,256,(g)=>{g.fillStyle='#fff';g.fillRect(0,0,256,256);g.lineWidth=16;g.strokeStyle='#1b1b2f';g.beginPath();g.ellipse(128,128,96,96,0,0,7);g.stroke();
  g.fillStyle='#1b1b2f';g.beginPath();for(let i=0;i<10;i++){const r=i%2?28:62,a=-Math.PI/2+i*Math.PI/5;g.lineTo(128+r*Math.cos(a),128+r*Math.sin(a))}g.fill()});
const waterTex=canvasTex(128,256,(g,w,h)=>{g.fillStyle='rgba(60,200,255,.35)';g.fillRect(0,0,w,h);g.strokeStyle='rgba(210,245,255,.9)';g.lineWidth=2;for(let i=0;i<40;i++){const x=rand(0,w),y=rand(0,h);g.beginPath();g.moveTo(x,y);g.lineTo(x+rand(-4,4),y+rand(12,30));g.stroke()}},[1,1]);
const poolTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#1fa8e0';g.fillRect(0,0,w,h);g.strokeStyle='rgba(220,250,255,.55)';g.lineWidth=3;for(let i=0;i<70;i++){g.beginPath();g.arc(rand(0,w),rand(0,h),rand(6,16),rand(0,3),rand(3,6));g.stroke()}},[3,3]);
// 챗GPT 생성 이미지
const cityPanoTex=loadTex('city_pano.jpg');cityPanoTex.wrapS=THREE.RepeatWrapping;cityPanoTex.repeat.set(2,1);
const facadeTex=loadTex('facade.jpg',[1,3]);
const starsTex=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(255,255,255,${rand(.3,1)})`;g.fillRect(rand(0,w),rand(0,h),rand(.6,2),rand(.6,2))}},[4,4]);

/* ---------- 바닥·발판 ---------- */
const groundMat=new THREE.MeshLambertMaterial({map:checkerTex});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);
const pad=new THREE.Mesh(new THREE.BoxGeometry(6,.5,6),[0,1,2,3,4,5].map(i=>new THREE.MeshLambertMaterial(i===2?{map:starTex}:{color:0xdde3e0})));pad.position.set(0,.25,0);scene.add(pad);

/* ---------- 경로: 300m 옥상에서 급강하 ---------- */
const pts=[];const TOP=300;
[[0,TOP,0],[0,TOP-2,14],[0,TOP-14,34],[0,TOP-60,62],[0,TOP-120,86],[8,TOP-160,110],[28,TOP-185,130],[44,TOP-200,160],[36,TOP-212,194],[8,TOP-222,214],[-22,TOP-232,232],[-30,TOP-244,264],[-14,TOP-256,290],[6,TOP-266,316],[14,TOP-276,346],[6,TOP-284,376],[0,TOP-288,400],[0,TOP-290,420],[0,TOP-289,432]].forEach(p=>pts.push(new THREE.Vector3(p[0],TOP-(TOP-p[1])*.66,p[2])));
const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.5);
const NS=1400;const L=curve.getLength();
const SP=[],ST=[],SB=[],SN=[];
for(let i=0;i<=NS;i++){const u=i/NS;const p=curve.getPointAt(u),t=curve.getTangentAt(u).normalize();
  const b=new THREE.Vector3().crossVectors(t,new THREE.Vector3(0,1,0)).normalize();const n=new THREE.Vector3().crossVectors(b,t).normalize();SP.push(p);ST.push(t);SB.push(b);SN.push(n)}
function frameAt(s){const f=Math.max(0,Math.min(NS,s/L*NS));const i=Math.min(NS-1,Math.floor(f)),k=f-i;const lerp=(A)=>A[i].clone().lerp(A[i+1],k);return{p:lerp(SP),t:lerp(ST).normalize(),b:lerp(SB).normalize(),n:lerp(SN).normalize()}}
const R=2.4;
function halfPipe(rad,a0,a1,segA,vRep,mat){const pos=[],uv=[],idx=[];
  for(let i=0;i<=NS;i++){for(let j=0;j<=segA;j++){const a=a0+(a1-a0)*j/segA;const p=SP[i].clone().addScaledVector(SB[i],rad*Math.sin(a)).addScaledVector(SN[i],-rad*Math.cos(a));pos.push(p.x,p.y,p.z);uv.push(j/segA,i/NS*vRep)}}
  for(let i=0;i<NS;i++)for(let j=0;j<segA;j++){const a=i*(segA+1)+j,b=a+segA+1;idx.push(a,b,a+1,b,b+1,a+1)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.userData.full=idx.length;return m}
const glassMat=new THREE.MeshPhysicalMaterial({color:0x9fe8ff,transparent:true,opacity:.4,roughness:.05,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const slide=halfPipe(R,-2.0,2.0,24,L/14,glassMat);slide.visible=false;scene.add(slide);
const neonMat=new THREE.MeshBasicMaterial({color:0x39d5ff,side:THREE.DoubleSide});
const neonL=halfPipe(R+.06,-2.15,-1.85,2,1,neonMat),neonR=halfPipe(R+.06,1.85,2.15,2,1,neonMat),neonB=halfPipe(R+.04,-.12,.12,2,1,new THREE.MeshBasicMaterial({color:0x7be9ff,side:THREE.DoubleSide,transparent:true,opacity:.7}));
[neonL,neonR,neonB].forEach(m=>{m.visible=false;scene.add(m)});
const waterMesh=halfPipe(R-.08,-1.15,1.15,14,L/8,new THREE.MeshBasicMaterial({map:waterTex,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));waterMesh.visible=false;scene.add(waterMesh);
const neonLights=[];
// 출발 탑 (빌딩)
const tower=new THREE.Group();tower.visible=false;scene.add(tower);
{const bm=new THREE.MeshLambertMaterial({map:facadeTex});const tx=facadeTex.clone();tx.repeat.set(6,40);tx.needsUpdate=true;
 const col=new THREE.Mesh(new THREE.BoxGeometry(34,TOP-2,34),new THREE.MeshLambertMaterial({map:tx}));col.position.set(0,(TOP-2)/2,-22);tower.add(col);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(36,2,36),new THREE.MeshLambertMaterial({color:0x2a2f45}));roof.position.set(0,TOP-1,-22);tower.add(roof);
 const rail=new THREE.Mesh(new THREE.TorusGeometry(16,.25,6,40),neonMat);rail.rotation.x=Math.PI/2;rail.position.set(0,TOP+1,-22);tower.add(rail);
 const spire=new THREE.Mesh(new THREE.CylinderGeometry(.3,1.2,30,8),new THREE.MeshLambertMaterial({color:0x8b93b5}));spire.position.set(-10,TOP+15,-30);tower.add(spire);
 const beacon=new THREE.Mesh(new THREE.SphereGeometry(1,8,8),new THREE.MeshBasicMaterial({color:0xff2a55}));beacon.position.set(-10,TOP+30,-30);tower.add(beacon);tower.userData.beacon=beacon}

/* ---------- 밤하늘 + 도시 파노라마 ---------- */
const night=new THREE.Group();night.visible=false;scene.add(night);
const starDome=new THREE.Mesh(new THREE.SphereGeometry(3500,32,16),new THREE.MeshBasicMaterial({map:starsTex,side:THREE.BackSide,transparent:true,opacity:0,fog:false}));night.add(starDome);
const pano=new THREE.Mesh(new THREE.CylinderGeometry(2600,2600,1500,64,1,true),new THREE.MeshBasicMaterial({map:cityPanoTex,side:THREE.BackSide,transparent:true,opacity:0,fog:false}));pano.position.y=560;night.add(pano);
const moonMesh=new THREE.Mesh(new THREE.SphereGeometry(60,24,16),new THREE.MeshBasicMaterial({color:0xfff6d8,fog:false}));moonMesh.position.set(-1400,1500,1600);night.add(moonMesh);

/* ---------- 빌딩 숲 (인스턴스) ---------- */
const B_N=420;const POOLX=0,POOLZ=440;
const bGeo=new THREE.BoxGeometry(1,1,1);bGeo.translate(0,.5,0);
const bMat=new THREE.MeshLambertMaterial({map:facadeTex});
const buildings=new THREE.InstancedMesh(bGeo,bMat,B_N);buildings.visible=false;scene.add(buildings);
const bData=[];
{let tries=0;while(bData.length<B_N&&tries<30000){tries++;const x=rand(-700,700),z=rand(-500,900);const w=rand(18,46),d=rand(18,46);
  if(Math.abs(x)<40&&z>-60&&z<60)continue;let ok=true;for(let i=0;i<=NS;i+=12){if(Math.abs(SP[i].x-x)<w/2+R+4&&Math.abs(SP[i].z-z)<d/2+R+4){ok=false;break}}if(!ok)continue;
  if(Math.hypot(x-POOLX,z-POOLZ)<70)continue;for(const b of bData){if(Math.abs(b.x-x)<(b.w+w)/2+6&&Math.abs(b.z-z)<(b.d+d)/2+6){ok=false;break}}if(!ok)continue;
  const dist=Math.hypot(x,z-200);const h=rand(40,120)+Math.max(0,200-dist*.3)*rand(.3,1.4)+(Math.random()<.08?rand(80,160):0);bData.push({x,z,w,d,h})}}
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_s=new THREE.Vector3(),_p=new THREE.Vector3();
function setBuildings(k){bData.forEach((b,i)=>{const g=Math.max(0,Math.min(1,k*1.5-i/bData.length*.5));const e=g<1?Math.sin(g*Math.PI/2):1;_s.set(b.w,b.h*e+.01,b.d);_p.set(b.x,0,b.z);_m.compose(_p,_q,_s);buildings.setMatrixAt(i,_m)});buildings.instanceMatrix.needsUpdate=true}
setBuildings(0);
// 도로 불빛 줄기
const roadLights=new THREE.Group();roadLights.visible=false;scene.add(roadLights);
{const geo=new THREE.BufferGeometry();const pos=[],col=[];for(let i=0;i<6000;i++){const lane=Math.floor(rand(0,12));const along=rand(-800,1000);const horiz=lane<6;const base=(lane%6-2.5)*230;const x=horiz?along:base+rand(-3,3),z=horiz?base+rand(-3,3)+200:along;
  pos.push(x,.5,z);const c=Math.random()<.5?[1,.6,.2]:[1,1,.9];col.push(...c)}
 geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 roadLights.add(new THREE.Points(geo,new THREE.PointsMaterial({size:3,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.9})))}

/* ---------- 라이더 (1인칭: 다리만) ---------- */
const rider=new THREE.Group();rider.visible=false;scene.add(rider);
const legs=new THREE.Group();
{const skin=new THREE.MeshLambertMaterial({color:0xf0b48c}),pants=new THREE.MeshLambertMaterial({color:0x14162b});
 const cap=(r,l,m)=>new THREE.Mesh(new THREE.CapsuleGeometry(r,l,4,10),m);
 for(const sx of[-1,1]){const th=cap(.26,.9,pants);th.rotation.x=Math.PI/2;th.position.set(.28*sx,.35,.5);legs.add(th);
  const sh=cap(.2,1,skin);sh.rotation.x=Math.PI/2+.08;sh.position.set(.3*sx,.33,1.6);legs.add(sh);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(.3,.18,.5),skin);foot.position.set(.3*sx,.42,2.3);legs.add(foot)}
 rider.add(legs)}

/* ---------- 코인 ---------- */
const COIN_N=100;const coins=[];
const coinGeo=new THREE.CylinderGeometry(.55,.55,.14,20);coinGeo.rotateX(Math.PI/2);

    camera.rotateZ(-ride.a*.25);
    const tf=Math.min(1,ride.v/45);ride.fov+=((60+30*tf)-ride.fov)*Math.min(1,dt*3);camera.fov=ride.fov;camera.updateProjectionMatrix();speedLines=Math.max(0,tf-.35)*1.2;
    if(st.lightning){lightningT-=dt;if(lightningT<=0){strike();lightningT=rand(2.5,5)}}
    if(ride.s>=L){ride.phase='air';ride.vel.copy(f.t).multiplyScalar(ride.v);ride.vel.y+=3;badge('점프! 🤸');sfxScream()}}
  else if(ride.phase==='air'){ride.vel.y-=PHY.g*dt;rider.position.addScaledVector(ride.vel,dt);
    camera.position.copy(rider.position).add(new THREE.Vector3(0,1.3,0));camLook.copy(rider.position).add(ride.vel.clone().normalize().multiplyScalar(8)).add(new THREE.Vector3(0,-3,0));camera.lookAt(camLook);
    const inPool=pool.visible&&Math.abs(rider.position.x-POOL.x)<POOL.w/2&&Math.abs(rider.position.z-POOL.z)<POOL.l/2;const fy=landing.floorY;
    if(rider.position.y<=(inPool?fy+1.05:fy+.6)){rider.position.y=inPool?fy+1.05:fy+.6;finish(inPool)}}}
function finish(inPool){ride.phase='done';windStop();speedLines=0;$('spdv').textContent=0;$('vig').style.opacity=0;
  const dist=Math.hypot(rider.position.x-POOL.x,rider.position.z-POOL.z);let title,bonus=0;
  if(!pool.visible){title='수영장이 없어요 😅'}else if(!inPool){title='옥상 밖! 😵'}else if(dist<3.3){title='정중앙!!';bonus=100}else if(dist<7){title='나이스!';bonus=50}else{title='풍덩!';bonus=10}
  if(inPool){splashFx();sfxSplash();flash(.9,600)}badge(title);if(bonus>=50){burst(true,'#ff6fae');setTimeout(sfxWin,300)}
  const score=coinsGot*10+bonus;camera.fov=60;camera.updateProjectionMatrix();
  setTimeout(()=>{$('rt').textContent=title;$('rl').innerHTML=`<li>최고 속도 <b>${Math.round(maxSpd)}</b> km/h</li><li>코인 <b>${coinsGot}</b> / ${COIN_N}</li><li>착지 보너스 <b>${bonus}</b></li><li>총점 <b>${score}</b></li>`;$('result').classList.add('on');busy=false;$('send').disabled=false},1800);
  camTo(rider.position.clone().add(new THREE.Vector3(22,16,-22)),rider.position.clone(),1600)}
$('again').onclick=()=>{audio();startRide()};$('reset').onclick=()=>location.reload();

/* ---------- 자동 데모 ---------- */
const DEMO=['밤으로 바꿔줘','도시 세워줘','워터슬라이드 세워줘','물 흘려줘','나 태워줘','코인 뿌려줘','수영장 놔줘','번개 쳐줘','효과음 넣어줘','출발'];
async function typeAndSend(text){const q=$('q');q.value='';q.focus({preventScroll:true});for(const ch of text){q.value+=ch;sfxType();await sleep(rand(70,130))}await sleep(350);q.value='';await handle(text)}
$('demo').onclick=async()=>{audio();if(demoRunning)return;demoRunning=true;$('demo').textContent='데모 중…';
  for(const cmd of DEMO){const id=(CMDS.find(c=>c.k.test(cmd))||{}).id;if(id&&st[id]&&id!=='lightning')continue;if(cmd==='출발'&&ride.phase==='done')break;await typeAndSend(cmd);while(busy&&ride.phase!=='ride')await sleep(100);await sleep(500)}
  while(ride.phase==='ride'||ride.phase==='air')await sleep(200);demoRunning=false;$('demo').textContent='자동 데모';$('q').blur()};

/* ---------- 루프 ---------- */
let last=performance.now();const TS=+new URLSearchParams(location.search).get('ts')||1;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];const k=Math.min(1,(now-t.t0)/t.dur);t.fn(k);if(k>=1){tweens.splice(i,1);t.res()}}
  if(waterMesh.visible)waterTex.offset.y-=dt*2.5;if(pool.visible)poolTex.offset.x+=dt*.03;
  if(coinGroup.visible)coins.forEach(c=>{if(c.m.visible)c.m.rotateZ(dt*3)});
  if(tower.visible)tower.userData.beacon.material.color.setScalar(.5+.5*Math.sin(now/300));
  if(night.visible)pano.rotation.y+=dt*.002;
  {const d2=dt*TS,n=Math.ceil(d2/(1/60));for(let i=0;i<n;i++)updateRide(d2/n)}
  renderer.render(scene,camera);drawFx(now);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__game={handle,st,ride,L,landing,POOL,bursts};
/* ---------- 완성 버전: 처음부터 다 만들어진 상태 ---------- */
night.visible=true;starDome.material.opacity=1;pano.material.opacity=1;scene.background.copy(BG_NIGHT);hemi.intensity=.25;sun.intensity=.1;moon.intensity=.5;scene.fog=new THREE.Fog(0x070a18,600,3200);
buildings.visible=roadLights.visible=true;groundMat.map=null;groundMat.color.set(0x0a0c16);groundMat.needsUpdate=true;setBuildings(1);
slide.visible=tower.visible=true;[neonL,neonR,neonB].forEach(m=>{m.visible=true;m.geometry.setDrawRange(0,m.userData.full)});slide.geometry.setDrawRange(0,slide.userData.full);
waterMesh.visible=true;waterMesh.geometry.setDrawRange(0,waterMesh.userData.full);
rider.visible=true;placeRider(0,0);coinGroup.visible=true;pool.visible=true;
Object.assign(st,{night:1,city:1,slide:1,water:1,rider:1,coin:1,pool:1,lightning:1});lightningT=3;
{const f=frameAt(1);camera.position.copy(f.p.clone().addScaledVector(f.t,9).addScaledVector(f.b,-2.5).add(new THREE.Vector3(0,3,0)));camLook.copy(rider.position);camera.lookAt(camLook)}
$("bar").style.display="none";$("demo").style.display="none";
$("go").onclick=()=>{audio();setSound(true);$("start").classList.add("off");startRide()};
$("reset").onclick=()=>{$("result").classList.remove("on");$("start").classList.remove("off")};
</script>
