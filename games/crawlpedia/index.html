<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>크롤피디아 · 커맨드 플레이</title>
<meta name="description" content="백과사전 속을 기어다니는 네온 생물. 마우스를 따라오며 단어를 뜯어 먹고 자라요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b2f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050507;color:#ddd;font-family:"Noto Serif KR",Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none;cursor:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:10px;left:10px;display:flex;gap:8px;z-index:5;font-family:"Noto Sans KR",sans-serif}
.stat{min-width:58px;padding:4px 10px 6px;border:2px solid #39d5ff;border-radius:12px;color:#fff;background:rgba(8,12,30,.75);box-shadow:0 0 12px rgba(57,213,255,.4)}
.stat small{display:block;font-size:11px;font-weight:700;opacity:.8}
.stat b{font-family:"Black Han Sans",sans-serif;font-size:22px;line-height:1;color:#39d5ff;text-shadow:0 0 8px #39d5ff}
.top-r{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5;font-family:"Noto Sans KR",sans-serif}
.btn{border:2px solid #39d5ff;background:rgba(8,12,30,.8);color:#fff;font:inherit;font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:13px;border-radius:12px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;box-shadow:0 0 10px rgba(57,213,255,.3)}
.btn:active{transform:translateY(1px)}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:rgba(0,0,0,.55);cursor:auto}
#start.off{display:none}
#start .box{text-align:center;font-family:"Noto Sans KR",sans-serif;max-width:92vw}
#start h1{font-family:"Black Han Sans",sans-serif;font-size:clamp(40px,9vw,80px);color:#fff;text-shadow:0 0 12px #39d5ff,0 0 40px #39d5ff;margin-bottom:14px}
#start p{color:#cfd3e6;font-weight:700;margin-bottom:22px;font-size:15px;line-height:1.7}
#go{font-family:"Black Han Sans",sans-serif;font-size:32px;padding:12px 44px;border-radius:999px;border:3px solid #39d5ff;background:#0b1024;color:#fff;box-shadow:0 0 24px #39d5ff;cursor:pointer}
.pick{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.pick button{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:14px;padding:8px 14px;border-radius:12px;border:2px solid #555;background:#0b1024;color:#ddd;cursor:pointer}
.pick button[aria-pressed="true"]{border-color:#39d5ff;color:#39d5ff;box-shadow:0 0 12px rgba(57,213,255,.6)}
#result{position:fixed;inset:0;display:none;place-items:center;z-index:9;background:rgba(5,8,20,.6);cursor:auto}
#result.on{display:grid}
.card{background:#10142a;border:2px solid #39d5ff;border-radius:22px;box-shadow:0 0 30px rgba(57,213,255,.5);padding:22px 26px;text-align:center;width:min(340px,90vw);color:#fff;font-family:"Noto Sans KR",sans-serif}
.card h2{font-family:"Black Han Sans",sans-serif;font-size:36px;text-shadow:0 0 12px #39d5ff}
.card ul{list-style:none;margin:14px 0 18px;font-weight:700;line-height:1.9}
.card ul b{font-family:"Black Han Sans",sans-serif;font-size:20px;color:#39d5ff}
.card .btn{font-size:16px;padding:10px 18px;margin:4px}
#badge{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(0);font-family:"Black Han Sans",sans-serif;font-size:clamp(30px,6vw,56px);color:#fff;text-shadow:0 0 10px #39d5ff,0 0 30px #39d5ff;white-space:nowrap;pointer-events:none;z-index:6;opacity:0}
#badge.show{animation:pop 1.4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
@media (max-width:520px){.stat b{font-size:18px}.btn{font-size:12px;padding:5px 9px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="stat"><small>먹은 단어</small><b id="eat">0</b></div><div class="stat"><small>몸길이</small><b id="len">8</b></div><div class="stat"><small>남은 시간</small><b id="tm">60</b></div></div>
<div class="top-r"><a class="btn" href="/" title="게임 목록">🏠</a><button class="btn" id="snd">소리 꺼짐</button></div>
<div id="badge"></div>
<div id="start"><div class="box"><h1>CRAWLPEDIA</h1><p>백과사전 속을 기어다니는 생물이 마우스를 따라와요.<br>빛나는 단어를 지나가면 뜯어 먹고 몸이 길어져요.<br>60초 동안 최대한 많이 먹어보세요. 붉은 단어는 독!</p>
  <div class="pick" id="pick"><button data-k="centipede" aria-pressed="true">🐛 지네</button><button data-k="spider">🕷️ 거미</button><button data-k="jelly">🪼 해파리</button></div><button id="go">기어가기</button></div></div>
<div id="result"><div class="card"><h2 id="rt">시간 종료</h2><ul id="rl"></ul><button class="btn" id="again">다시</button></div></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);layoutText()}
addEventListener('resize',resize);
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- 사운드 (Openverse CC0 글리치 샘플) ---------- */
let AC=null,master=null,sound=false;const BUF={};
const SFX={g01:'sfx/g01.mp3',gs1:'sfx/gs1.mp3',vhs:'sfx/vhs.mp3',corr:'sfx/corr.mp3',noise:'sfx/noise.mp3',odd:'sfx/odd.mp3'};
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=1.6;const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;master.connect(comp);comp.connect(AC.destination);
  for(const [k,u] of Object.entries(SFX))fetch(u).then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(d=>BUF[k]=d).catch(()=>{})}if(AC.state==='suspended')AC.resume();return AC}
function play(k,{vol=1,rate=1,off=0,dur=0,pan=0}={}){if(!sound||!AC||!BUF[k])return;const s=AC.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=rate;const g=AC.createGain();g.gain.value=vol;let node=s;if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));s.connect(p);node=p}node.connect(g);g.connect(master);const t=AC.currentTime;s.start(t,off,dur||undefined);}
function tone(f,dur,vol,type='sine',t0=0){if(!sound)return;const ac=audio();const o=ac.createOscillator(),gn=ac.createGain();const t=ac.currentTime+t0;o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.005);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.05)}
const panOf=x=>(x/W-.5)*1.6;
// 먹기: 짧은 글리치 두 겹 + 피치 랜덤
function sfxEat(x){play('g01',{vol:1.2,rate:rand(.9,1.6),pan:panOf(x)});play('gs1',{vol:.9,rate:rand(1.2,2.2),off:0,dur:.25,pan:panOf(x)});if(Math.random()<.4)play('corr',{vol:.6,rate:rand(1.5,2.5),off:rand(0,.6),dur:.2,pan:panOf(x)})}
// 글자 스침: 아주 짧은 조각을 빠르게 (타이핑 느낌)
function sfxGraze(x){play(Math.random()<.5?'gs1':'g01',{vol:rand(.35,.7),rate:rand(1.6,3.2),off:rand(0,.2),dur:.09,pan:panOf(x)})}
function sfxBad(x){play('odd',{vol:1.3,rate:.7,dur:1.2,pan:panOf(x)});play('noise',{vol:.9,rate:.8,dur:.8,pan:panOf(x)})}
function sfxWin(){play('vhs',{vol:1.2,rate:1});[1046,1318,1568,2093].forEach((f,i)=>tone(f,.4,.25,'triangle',i*.1+.3))}
// 움직임 소리: 속도에 비례해 노이즈 조각을 뿌림
let moveAcc=0;function sfxMove(speed,x){moveAcc+=speed;if(moveAcc>90){moveAcc=0;play('noise',{vol:Math.min(.5,.12+speed/900),rate:rand(1.8,3.5),off:rand(0,1.2),dur:.07,pan:panOf(x)})}}
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'소리 켜짐':'소리 꺼짐';if(sound)audio()};

/* ---------- 백과사전 텍스트 ---------- */
const ARTICLE=`Centipedes are predatory arthropods belonging to the class Chilopoda. Despite the name, centipedes can have a varying number of legs, ranging from 30 to 354. Centipedes always have an odd number of pairs of legs. They have a pair of venom claws, which are a modification of the first pair of legs. Centipedes are predominantly generalist carnivores, hunting for a variety of prey items that can be overpowered. They have a wide geographical range, and can be found in terrestrial habitats from tropical rainforests to deserts. Within these habitats, centipedes require a moist microhabitat because they lack the waxy cuticle of insects and arachnids, causing them to rapidly lose water. Accordingly, they avoid direct sunlight by staying under cover or by being active at night.
Spiders are air-breathing arthropods that have eight legs, chelicerae with fangs generally able to inject venom, and spinnerets that extrude silk. They are the largest order of arachnids and rank seventh in total species diversity among all orders of organisms. Spiders are found worldwide on every continent except Antarctica, and have become established in nearly every land habitat. Anatomically, spiders differ from other arthropods in that the usual body segments are fused into two tagmata, the cephalothorax and abdomen, and joined by a small cylindrical pedicel. Unlike insects, spiders do not have antennae. In all except the most primitive group, spiders have the most centralized nervous systems of all arthropods.
The ovaries are made mostly of volatile functions. Many insects are divided by tracheae, openings on the xylem and store segments; it is wingless Aptera, mesothorax enclosed in compound eyes or a lower plate on the junction between the abdomen is hindgut. The Brazilian stingless bee detects airborne volatile compounds for a ventral nerve cell that pulses peristaltically. In 1874, insect Archaeognatha are capable of plants. Phasmatodea and spermathecae to feed on the saliva. Circulatory. Main article: Insect reproductive system of the head is enclosed in a hard, heavily sclerotized head capsule, which contains most of the sensing organs, including the antennae, compound eyes, ocelli, and mouthparts. The thorax is composed of three sections named from front to back the prothorax, mesothorax and metathorax. The prothorax carries the first pair of legs and the mesothorax carries the second pair of legs and the front wings. The abdomen is the largest part of the insect, typically with 11 to 12 segments, and is less strongly sclerotized than the head or thorax.
Moths produce ultrasonic clicks that have their unpalatability to bats, while some palatable moths mimic the acoustic signal. Ultrasonic recording and high-speed infrared videography of bat-moth interactions suggest the palatable tiger moth really does defend against attacking big brown bats using ultrasonic clicks that jam bat sonar. Very low sounds are produced in various species of Hymenoptera, Lepidoptera, Mantodea and Neuroptera. These low sounds are produced by the insect's muscles and joints; these sounds can be used to warn or communicate with other insects. Most sound-making insects also have tympanal organs that can perceive airborne sounds. Some hemipterans, such as the water boatmen, are capable of communicating via underwater sounds.`;
const WORDS=['venom','predator','segment','antenna','mandible','carapace','silk','cuticle','larva','thorax','chitin','spiracle','ocelli','abdomen','pedicel','spinneret','molting','exoskeleton','tracheae','hemolymph','ganglion','pheromone','nocturnal','burrow','prey','fangs','claws','legs','eyes','wings'];
const BAD=['pesticide','DDT','fire','frost','bleach','sunlight','drought','vacuum'];
let lines=[],tokens=[],FS=14,LH=22;
function layoutText(){lines=[];tokens=[];FS=W<600?12:14;LH=FS*1.6;g.font=`${FS}px "Noto Serif KR",Georgia,serif`;
  const cols=W<700?1:2;const colW=cols===1?W-40:(W-70)/2;const colX=[20,W/2+15];
  const base=ARTICLE.split(/\s+/);const words=[];const off=Math.floor(Math.random()*base.length);while(words.length<base.length*3)words.push(base[(off+words.length)%base.length]);let x=0,y=LH+70,col=0;let line=[];
  const flush=()=>{if(line.length)lines.push({x:colX[col],y,words:line});line=[];x=0;y+=LH;if(y>H-40){col++;y=LH+70;if(col>=cols)return false}return true};
  for(const w of words){const ww=g.measureText(w+' ').width;if(x+ww>colW){if(!flush())break}line.push({w,x:colX[col]+x,y});x+=ww}
  flush();
  // 토큰(먹을 수 있는 단어) 배치
  for(const L of lines)for(const t of L.words){const clean=t.w.replace(/[^a-zA-Z]/g,'').toLowerCase();t.cx=t.x+g.measureText(t.w).width/2;t.cy=t.y-FS*.35;t.hw=g.measureText(t.w).width/2;
    if(Math.random()<.12){t.kind='good';t.col=['#39d5ff','#7bff8a','#ffd23f','#ff6fae','#b14cff'][Math.floor(rand(0,5))]}else if(Math.random()<.025){t.kind='bad';t.col='#ff3b3b'}else t.kind='';t.eaten=false;tokens.push(t)}}

/* ---------- 생물 ---------- */
const KIND={centipede:{n:34,sp:.42,legs:true,col:'#7bff8a',col2:'#ffd23f'},spider:{n:12,sp:.5,legs:'spider',col:'#39d5ff',col2:'#ff6fae'},jelly:{n:22,sp:.24,legs:false,col:'#b14cff',col2:'#39d5ff'}};
let kind='centipede',segs=[],mouse={x:innerWidth/2,y:innerHeight/2},head={x:innerWidth/2,y:innerHeight/2,a:0},eaten=0,timeLeft=60,running=false,particles=[],bursts=[],lastT=0,wiggle=0;
function initCreature(){const k=KIND[kind];segs=[];for(let i=0;i<k.n;i++)segs.push({x:head.x-i*12,y:head.y});$('len').textContent=segs.length}
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function badge(t){}
const labels=[],flyers=[];function burst(x,y,col,word){for(let i=0;i<14;i++)particles.push({x,y,vx:rand(-160,160),vy:rand(-200,60),life:rand(.4,.9),col,s:rand(2,5)});bursts.push({x,y,t:0,col});if(word)labels.push({x:x+rand(-30,30),y:y+rand(-30,30),a:rand(-.9,.9),w:word,col,t:0})}

/* ---------- 업데이트 ---------- */
function update(dt){const k=KIND[kind];wiggle+=dt*8;
  // 머리가 마우스를 쫓아감 (관성)
  const dx=mouse.x-head.x,dy=mouse.y-head.y,d=Math.hypot(dx,dy);
  if(d>2){const sp=Math.min(d,900*k.sp*dt*60/60);head.x+=dx/d*Math.min(d,sp*dt*60);head.y+=dy/d*Math.min(d,sp*dt*60)}
  head.a=Math.atan2(dy,dx);if(running)sfxMove(Math.min(d,40),head.x);
  // 몸통 체인 (각 마디가 앞 마디를 따라감)
  let px=head.x,py=head.y;const gap=kind==='spider'?8:12;
  for(const s of segs){const ddx=px-s.x,ddy=py-s.y,dd=Math.hypot(ddx,ddy)||1;if(dd>gap){s.x+=ddx/dd*(dd-gap);s.y+=ddy/dd*(dd-gap)}px=s.x;py=s.y}
  // 지나가는 자리의 글자가 흰색으로 흩날림
  for(const t of tokens){if(t.eaten||t.kind||t.flew)continue;if(Math.abs(head.x-t.cx)<t.hw+6&&Math.abs(head.y-t.cy)<FS*.7){t.flew=true;t.eaten=true;const a=head.a+rand(-.6,.6);const sp=rand(120,260);
    flyers.push({w:t.w,x:t.cx,y:t.cy,vx:Math.cos(a)*sp+rand(-60,60),vy:Math.sin(a)*sp-rand(40,140),va:rand(-4,4),a:rand(-.3,.3),life:rand(1.2,2.2),t:0,sz:FS});sfxGraze(t.cx)}}
  // 먹기
  for(const t of tokens){if(t.eaten||!t.kind)continue;if(Math.abs(head.x-t.cx)<t.hw+8&&Math.abs(head.y-t.cy)<FS*.8){t.eaten=true;
    if(t.kind==='good'){eaten++;$('eat').textContent=eaten;burst(t.cx,t.cy,t.col,t.w.replace(/[^a-zA-Z]/g,''));sfxEat(t.cx);for(const ch of t.w){flyers.push({w:ch,x:t.cx+rand(-t.hw,t.hw),y:t.cy,vx:rand(-220,220),vy:rand(-260,-60),va:rand(-8,8),a:0,life:rand(.8,1.6),t:0,sz:FS+2,col:'#fff'})}for(let i=0;i<2;i++){const l=segs[segs.length-1];segs.push({x:l.x,y:l.y})}$('len').textContent=segs.length;if(eaten%10===0)badge(eaten+'개! 🔥')}
    else{burst(t.cx,t.cy,'#ff3b3b');sfxBad(t.cx);const cut=Math.min(segs.length-6,6);if(cut>0)segs.splice(segs.length-cut,cut);$('len').textContent=segs.length;badge('독! 😵');timeLeft=Math.max(0,timeLeft-5)}}}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1)}
  for(let i=bursts.length-1;i>=0;i--){bursts[i].t+=dt;if(bursts[i].t>.6)bursts.splice(i,1)}
  for(let i=labels.length-1;i>=0;i--)if(labels[i].t>11)labels.splice(i,1);
  for(let i=flyers.length-1;i>=0;i--){const f=flyers[i];f.t+=dt;f.vy+=140*dt;f.vx*=Math.pow(.6,dt);f.x+=f.vx*dt;f.y+=f.vy*dt;f.a+=f.va*dt;if(f.t>f.life)flyers.splice(i,1)}
  if(running){timeLeft-=dt;$('tm').textContent=Math.ceil(timeLeft);if(timeLeft<=0)finish()}
  if(tokens.length&&(!tokens.some(t=>t.kind==='good'&&!t.eaten)||tokens.filter(t=>t.eaten).length>tokens.length*.7)){layoutText()}}

/* ---------- 그리기 ---------- */
function draw(){g.fillStyle='#050507';g.fillRect(0,0,W,H);
  // 제목
  g.font=`700 ${FS+6}px "Noto Serif KR",serif`;g.fillStyle='#777';g.fillText('CRAWLPEDIA',20,40);g.font=`${FS-2}px "Noto Sans KR",sans-serif`;g.fillStyle='#444';g.fillText('The free encyclopedia that crawls',20+ (FS+6)*7.2,40);
  g.strokeStyle='#222';g.lineWidth=1;g.beginPath();g.moveTo(20,52);g.lineTo(W-20,52);g.stroke();
  // 본문
  g.font=`${FS}px "Noto Serif KR",Georgia,serif`;
  for(const t of tokens){if(t.eaten){continue}
    if(t.kind==='good'){g.fillStyle=t.col;g.shadowColor=t.col;g.shadowBlur=10;g.fillText(t.w,t.x,t.y);g.shadowBlur=0}
    else if(t.kind==='bad'){g.fillStyle='#ff3b3b';g.shadowColor='#ff3b3b';g.shadowBlur=8;g.fillText(t.w,t.x,t.y);g.shadowBlur=0;g.strokeStyle='rgba(255,59,59,.6)';g.strokeRect(t.x-2,t.y-FS,t.hw*2+4,FS+4)}
    else{g.fillStyle='#8a8a96';g.fillText(t.w,t.x,t.y)}}
  // 먹힌 자리: 네온 네모 라벨
  for(const t of tokens){if(!t.eaten||!t.kind)continue;g.strokeStyle=t.kind==='bad'?'rgba(255,59,59,.35)':t.col+'66';g.lineWidth=1;g.strokeRect(t.x-1,t.y-FS+1,t.hw*2+2,FS+2)}
  // 생물
  const k=KIND[kind];g.lineCap='round';g.lineJoin='round';
  // 몸 선
  g.strokeStyle=k.col;g.shadowColor=k.col;g.shadowBlur=14;g.lineWidth=kind==='jelly'?2:2.8;
  g.beginPath();g.moveTo(head.x,head.y);for(const s of segs)g.lineTo(s.x,s.y);g.stroke();
  // 마디 네모 + 다리
  let prev={x:head.x,y:head.y};
  segs.forEach((s,i)=>{const a=Math.atan2(prev.y-s.y,prev.x-s.x);const nx=-Math.sin(a),ny=Math.cos(a);
    if(kind!=='jelly'||i%3===0){g.save();g.translate(s.x,s.y);g.rotate(a);g.strokeStyle=i%2?k.col:k.col2;g.lineWidth=1.2;const sz=kind==='spider'?(i<3?11:6):9;g.strokeRect(-sz/2,-sz/2,sz,sz);g.restore()}
    if(k.legs===true&&i%2===0){const ph=Math.sin(wiggle+i*.7)*.6;const L=17+Math.sin(wiggle*.5+i)*2;for(const sd of[-1,1]){g.strokeStyle=k.col;g.lineWidth=1;g.beginPath();g.moveTo(s.x,s.y);const kx=s.x+nx*sd*L*.6+Math.cos(a)*ph*6,ky=s.y+ny*sd*L*.6+Math.sin(a)*ph*6;g.lineTo(kx,ky);g.lineTo(kx+nx*sd*L*.5-Math.cos(a)*4,ky+ny*sd*L*.5-Math.sin(a)*4);g.stroke();g.fillStyle='#fff';g.fillRect(kx+nx*sd*L*.5-Math.cos(a)*4-1,ky+ny*sd*L*.5-Math.sin(a)*4-1,2,2)}}
    if(kind==='jelly'&&i>8){g.strokeStyle=k.col2;g.lineWidth=.8;g.globalAlpha=.6;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x+Math.sin(wiggle+i)*14,s.y+16+Math.cos(wiggle*.7+i)*6);g.stroke();g.globalAlpha=1}
    prev=s});
  if(k.legs==='spider'){for(let i=0;i<8;i++){const sd=i<4?-1:1,j=i%4;const a=head.a;const ph=Math.sin(wiggle*1.5+j*1.2+(sd>0?1:0))*.35;const base=segs[Math.min(segs.length-1,j)];const ang=a+sd*(0.5+j*.5)+ph;const L=22;const kx=base.x+Math.cos(ang)*L,ky=base.y+Math.sin(ang)*L;const ang2=ang+sd*.9;g.strokeStyle=k.col;g.lineWidth=1.3;g.beginPath();g.moveTo(base.x,base.y);g.lineTo(kx,ky);g.lineTo(kx+Math.cos(ang2)*L*.9,ky+Math.sin(ang2)*L*.9);g.stroke();g.fillStyle='#fff';g.fillRect(kx-1,ky-1,2,2)}}
  // 머리
  g.save();g.translate(head.x,head.y);g.rotate(head.a);g.fillStyle=k.col2;g.shadowColor=k.col2;g.shadowBlur=18;g.fillRect(-6,-6,12,12);g.fillStyle='#fff';g.fillRect(2,-4,2,2);g.fillRect(2,2,2,2);
  g.strokeStyle=k.col2;g.lineWidth=1.5;g.beginPath();g.moveTo(5,-3);g.lineTo(14,-9);g.moveTo(5,3);g.lineTo(14,9);g.stroke();g.restore();g.shadowBlur=0;
  // 머리 ↔ 마우스 연결 선 + 커서 링
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;g.setLineDash([3,5]);g.beginPath();g.moveTo(head.x,head.y);g.lineTo(mouse.x,mouse.y);g.stroke();g.setLineDash([]);
  g.strokeStyle='#fff';g.beginPath();g.arc(mouse.x,mouse.y,9,0,7);g.stroke();g.beginPath();g.moveTo(mouse.x-14,mouse.y);g.lineTo(mouse.x-5,mouse.y);g.moveTo(mouse.x+5,mouse.y);g.lineTo(mouse.x+14,mouse.y);g.moveTo(mouse.x,mouse.y-14);g.lineTo(mouse.x,mouse.y-5);g.moveTo(mouse.x,mouse.y+5);g.lineTo(mouse.x,mouse.y+14);g.stroke();
  // 흩날리는 흰 글자
  for(const f of flyers){const al=Math.max(0,1-f.t/f.life);g.save();g.globalAlpha=al;g.translate(f.x,f.y);g.rotate(f.a);g.font=`${f.sz}px "Noto Serif KR",Georgia,serif`;g.fillStyle=f.col||'#fff';g.shadowColor='#fff';g.shadowBlur=6;g.textAlign='center';g.fillText(f.w,0,0);g.restore()}g.textAlign='left';
  // 뜯어낸 단어 라벨 (영상처럼 돌아간 네온 칩)
  g.font=`700 ${FS-2}px "Noto Sans KR",sans-serif`;for(const l of labels){l.t+=1/60;const a=Math.min(1,l.t*3)*Math.max(0,1-(l.t-8)/3);if(a<=0)continue;g.save();g.globalAlpha=a*.9;g.translate(l.x,l.y);g.rotate(l.a);const w=g.measureText(l.w).width+10;g.fillStyle='#050507';g.strokeStyle=l.col;g.lineWidth=1.2;g.fillRect(-w/2,-9,w,18);g.strokeRect(-w/2,-9,w,18);g.fillStyle=l.col;g.textAlign='center';g.textBaseline='middle';g.fillText(l.w,0,0);g.restore()}g.textAlign='left';g.textBaseline='alphabetic';g.font=`${FS}px "Noto Serif KR",Georgia,serif`;
  // 파티클
  for(const p of particles){g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.col;g.fillRect(p.x,p.y,p.s,p.s)}g.globalAlpha=1;
  for(const b of bursts){const r=10+b.t*120;g.strokeStyle=b.col;g.globalAlpha=1-b.t/.6;g.lineWidth=2;g.strokeRect(b.x-r/2,b.y-r/2,r,r);g.globalAlpha=1}}

function loop(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;update(dt);draw();requestAnimationFrame(loop)}
function finish(){running=false;$('rt').textContent=eaten>=40?'포식자 👑':eaten>=20?'배부름 😋':'아직 배고파 😢';$('rl').innerHTML=`<li>먹은 단어 <b>${eaten}</b></li><li>최종 몸길이 <b>${segs.length}</b> 마디</li>`;$('result').classList.add('on');sfxWin()}
function start(){$('start').classList.add('off');$('result').classList.remove('on');eaten=0;timeLeft=60;$('eat').textContent=0;$('tm').textContent=60;layoutText();head.x=W/2;head.y=H/2;initCreature();running=true;badge('기어간다 🐛')}
$('pick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;[...$('pick').children].forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('go').onclick=()=>{audio();sound=true;$('snd').textContent='소리 켜짐';start()};
$('again').onclick=()=>{$('result').classList.remove('on');$('start').classList.remove('off')};
resize();initCreature();requestAnimationFrame(loop);
window.__game={get eaten(){return eaten},get segs(){return segs},tokens:()=>tokens,mouse,head,start};
</script>
