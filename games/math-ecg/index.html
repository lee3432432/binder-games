<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수학 심전도 · 커맨드 플레이</title>
<meta name="description" content="함수가 환자예요. 모니터 위로 그래프가 흐르고, 그 높이 그대로 소리가 나요. 함수를 바꾸면 환자 상태가 바뀝니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{--g:#39ff8a;--bg:#020804}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#cfe;font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* 모니터 상단 바 */
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px;font-family:"Share Tech Mono",monospace;font-size:13px;color:#7fbf9a}
.bar b{color:var(--g);text-shadow:0 0 8px var(--g)}
.vitals{display:flex;gap:10px;padding:0 12px 6px;font-family:"Share Tech Mono",monospace}
.v{flex:1;border:1px solid #163d28;border-radius:8px;padding:6px 8px;background:rgba(0,0,0,.4)}
.v small{display:block;font-size:10px;color:#5a9a74;letter-spacing:.08em}
.v b{font-size:26px;color:var(--g);text-shadow:0 0 10px var(--g);line-height:1.1}
.v.warn b{color:#ffd23f;text-shadow:0 0 10px #ffd23f}.v.bad b{color:#ff4f6a;text-shadow:0 0 10px #ff4f6a}
#stage{position:relative;flex:1;min-height:0;margin:0 10px;border:1px solid #163d28;border-radius:10px;overflow:hidden;background:#000}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:"Black Han Sans",sans-serif;font-size:clamp(22px,6vw,44px);color:var(--g);text-shadow:0 0 10px var(--g),0 0 30px var(--g);white-space:nowrap;pointer-events:none;transition:color .3s}
#status.warn{color:#ffd23f;text-shadow:0 0 10px #ffd23f,0 0 30px #ffd23f}#status.bad{color:#ff4f6a;text-shadow:0 0 10px #ff4f6a,0 0 30px #ff4f6a}
#status.flash{animation:fl .5s steps(2) infinite}@keyframes fl{50%{opacity:.2}}
#formula{position:absolute;left:12px;bottom:10px;font-size:clamp(14px,3.6vw,20px);color:#fff;text-shadow:0 0 6px var(--g);max-width:calc(100% - 24px);overflow:hidden;white-space:nowrap}
#formula .katex{color:#fff}
.top-r{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:5}
.btn{border:1px solid #2a6a45;background:rgba(0,0,0,.7);color:#cfe;font:inherit;font-weight:900;font-size:12px;border-radius:8px;padding:5px 9px;cursor:pointer;text-decoration:none}
/* 처치 버튼 */
#ops{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 2px;scrollbar-width:none}#ops::-webkit-scrollbar{display:none}
.op{flex:none;border:1px solid #2a6a45;background:#041a0e;color:#cfe;border-radius:10px;padding:8px 11px;font:inherit;font-weight:900;font-size:13px;cursor:pointer}
.op.hot{border-color:#ff4f6a;color:#ff8fa3}
#picker{display:flex;gap:8px;overflow-x:auto;padding:8px 10px 14px;scrollbar-width:none}#picker::-webkit-scrollbar{display:none}
.fn{flex:none;border:2px solid #163d28;background:#020c06;color:#cfe;border-radius:14px;padding:9px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-align:left;min-width:128px}
.fn b{display:block;font-size:15px;color:var(--c)}.fn small{display:block;color:#5a9a74;font-size:11px;margin-top:2px}
.fn[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 14px var(--c)}
#tap{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:rgba(0,0,0,.75)}
#tap.off{display:none}
#tap h1{font-family:"Black Han Sans",sans-serif;font-size:clamp(34px,9vw,70px);color:var(--g);text-shadow:0 0 12px var(--g),0 0 40px var(--g);text-align:center;line-height:1.05}
#tap p{color:#9fd;font-weight:700;margin:14px 0 22px;text-align:center;font-size:14px;line-height:1.6}
#tap button{font-family:"Black Han Sans",sans-serif;font-size:30px;padding:12px 40px;border-radius:999px;border:3px solid var(--g);background:#000;color:#fff;box-shadow:0 0 24px var(--g);cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><span>PATIENT: <b id="pname">f(x)</b></span><span>WARD <b>MATH-ICU</b></span><span id="clock">00:00</span></div>
  <div class="vitals"><div class="v" id="vHR"><small>HR · 분당 박동</small><b id="hr">--</b></div><div class="v" id="vAMP"><small>AMP · 진폭</small><b id="amp">--</b></div><div class="v" id="vFREQ"><small>PITCH · 음높이</small><b id="pitch">--</b></div></div>
  <div id="stage"><canvas id="c"></canvas><div id="status">대기 중</div><div id="formula"></div>
    <div class="top-r"><a class="btn" href="/">🏠</a><button class="btn" id="mute">🔊</button></div>
    <div id="tap"><div><h1>수학 심전도</h1><p>함수가 환자예요. 모니터로 그래프가 흐르고<br>그래프 높이 그대로 소리가 나요.<br>처치 버튼으로 환자를 살리거나… 보내세요.</p><div style="text-align:center"><button id="go">입원</button></div></div></div>
  </div>
  <div id="ops"><button class="op" data-op="x2">⚡ 전기충격 ×2</button><button class="op" data-op="half">💊 진정제 ÷2</button><button class="op" data-op="fast">⏩ 심박 ↑</button><button class="op" data-op="slow">⏪ 심박 ↓</button><button class="op" data-op="noise">🫨 발작 (+노이즈)</button><button class="op" data-op="abs">🪞 절댓값</button><button class="op hot" data-op="flat">🪦 산소 차단 (→0)</button><button class="op" data-op="reset">↻ 소생</button></div>
  <div id="picker"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);const r=$('stage').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);
const rand=(a,b)=>a+Math.random()*(b-a);
const gcd=(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){[a,b]=[b,a%b]}return a};

/* ---------- 환자(함수) ---------- */
const FUNCS=[
 {id:'ecg',name:'정상 심전도',cap:'환자 안정',tex:'f(x)=e^{-40(x-\\lfloor x\\rfloor-.5)^2}\\cdot 6-\\,\\ldots',col:'#39ff8a',period:1,f:x=>{const t=x-Math.floor(x);const spike=6*Math.exp(-900*Math.pow(t-.5,2))-2.5*Math.exp(-900*Math.pow(t-.46,2))-1.5*Math.exp(-700*Math.pow(t-.56,2));const p=1.2*Math.exp(-80*Math.pow(t-.25,2));const tw=1.6*Math.exp(-50*Math.pow(t-.78,2));return spike+p+tw},tone:'sine',status:'안정'},
 {id:'heart',name:'사랑에 빠짐',cap:'심장이 터질 듯',tex:'f(x)=\\sqrt{3-x^2}\\,\\sin(16\\pi x)',col:'#ff5ad9',period:3.46,f:x=>{const u=((x%3.46)+3.46)%3.46-1.73;return (Math.cbrt(u*u)*.8+Math.sqrt(Math.max(0,3-u*u))*Math.sin(16*Math.PI*u))*1.7},tone:'square',status:'두근두근'},
 {id:'amb',name:'구급차 호출',cap:'삐뽀삐뽀',tex:'f(x)=\\sum_{k=1}^{12}\\frac{\\sin((2k+1)x)}{2k+1}\\cdot 5',col:'#ff5a8a',period:6.28,f:x=>{let s=0;for(let k=1;k<=12;k++)s+=Math.sin((2*k+1)*x*2)/(2*k+1);return 5*s},tone:'saw',status:'위급'},
 {id:'gcd',name:'로봇 환자',cap:'땅땅 띵똥',tex:'f(x)=\\gcd(\\lfloor 4x\\rfloor,\\,8)-4',col:'#7ec8ff',period:8,f:x=>gcd(Math.floor(4*x),8)-4,discrete:true,tone:'triangle',status:'기계음'},
 {id:'mosq',name:'모기 물림',cap:'앵앵',tex:'f(x)=4\\cos 3x-\\cos 15x',col:'#c74bff',period:2.09,f:x=>4*Math.cos(3*x)-Math.cos(15*x),tone:'sine',status:'가려움'},
 {id:'puppy',name:'휴게소 강아지',cap:'낑낑',tex:'f(x)=8\\sqrt{\\sin(6x)}',col:'#8dff6a',period:1.05,f:x=>{const s=Math.sin(6*x);return s>=0?8*Math.sqrt(s)-3:NaN},tone:'sine',status:'낑낑'},
 {id:'tan',name:'혈압 폭발',cap:'tan 뚫고 올라감',tex:'f(x)=\\tan(x)',col:'#ffd23f',period:3.14,f:x=>Math.max(-9,Math.min(9,Math.tan(x))),tone:'saw',status:'혈압 주의'},
 {id:'sinc',name:'잠들기 직전',cap:'점점 잦아듦',tex:'f(x)=\\frac{8\\sin(5x)}{x}',col:'#4cc9f0',period:12,f:x=>{const u=((x%12)+12)%12-6;return u===0?40:8*Math.sin(5*u)/u},tone:'sine',status:'졸림'},
 {id:'saw',name:'공사장 이송',cap:'드르륵',tex:'f(x)=6(x\\bmod 1)-3',col:'#ff9a3c',period:1,f:x=>6*(((x%1)+1)%1)-3,tone:'saw',status:'시끄러움'},
 {id:'snore',name:'코골이',cap:'드르렁… 푸우',tex:'f(x)=5\\sin\\tfrac{x}{2}\\,\\sin(40x)',col:'#9fb4ff',period:12.57,freq:95,f:x=>{const b=Math.sin(x/2);return b>0?5*b*Math.sin(40*x)*(1+.5*Math.sin(7*x)):1.5*b*(1+.1*Math.sin(3*x))},tone:'saw',status:'드르렁'},
 {id:'flat',name:'퇴원(?)',cap:'…',tex:'f(x)=0',col:'#ff4f6a',period:1,f:x=>0,tone:'sine',status:'사망'},
];
const OPS={x2:f=>x=>f(x)*2,half:f=>x=>f(x)/2,abs:f=>x=>Math.abs(f(x)),noise:f=>x=>f(x)+Math.sin(x*97.3)*Math.cos(x*53.1)*2.2,flat:f=>x=>0};
let base=FUNCS[0],mods=[],speed=1,running=false,xHead=0,lastT=0,samples=[],hrBeats=[],flatSince=null,muted=false;
const SPX=140;// 픽셀/초 (화면 스크롤 속도)
const XPERPX=1/60;// x 단위/픽셀
function cf(){let f=base.f;for(const m of mods)f=OPS[m](f);return f}

/* ---------- 오디오 ---------- */
let AC=null,master=null,osc=null,og=null,lfo=null;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=1.3;const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;master.connect(comp);comp.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function startVoice(type,cut){stopVoice();const ac=audio();osc=ac.createOscillator();osc.type=type==='saw'?'sawtooth':type;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut||2600;og=ac.createGain();og.gain.value=0;osc.connect(fl);fl.connect(og);og.connect(master);osc.start();lfo=ac.createOscillator();const lg=ac.createGain();lfo.frequency.value=5.5;lg.gain.value=3;lfo.connect(lg);lg.connect(osc.frequency);lfo.start()}
function stopVoice(){if(osc){const o=osc,l=lfo,gg=og;try{gg.gain.setTargetAtTime(0,AC.currentTime,.03)}catch(e){}setTimeout(()=>{try{o.stop();l.stop()}catch(e){}},250);osc=null}}
let lastDisc=null;
function voice(y,disc){if(!osc||muted)return;const t=AC.currentTime;if(isNaN(y)){og.gain.setTargetAtTime(0,t,.01);return}
  const n=Math.max(-1,Math.min(1,y/9));const f=(base.freq||330)*Math.pow(2,n*2.2);
  if(disc){if(lastDisc!==y){osc.frequency.setValueAtTime(f,t);og.gain.cancelScheduledValues(t);og.gain.setValueAtTime(.001,t);og.gain.exponentialRampToValueAtTime(.7,t+.01);og.gain.exponentialRampToValueAtTime(.06,t+.3)}lastDisc=y;return}
  osc.frequency.setTargetAtTime(f,t,.01);og.gain.setTargetAtTime(Math.abs(y)<.02?.0:.5,t,.02)}
function beep(f=880,d=.08,v=.3,type='square'){if(muted)return;const ac=audio();const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;const t=ac.currentTime;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.005);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.05)}
let flatOsc=null;function flatline(on){if(on&&!flatOsc&&!muted){const ac=audio();flatOsc=ac.createOscillator();const gn=ac.createGain();flatOsc.frequency.value=1000;gn.gain.value=.25;flatOsc.connect(gn);gn.connect(master);flatOsc.start()}if(!on&&flatOsc){try{flatOsc.stop()}catch(e){}flatOsc=null}}
function sfxShock(){beep(120,.35,.6,'sawtooth');setTimeout(()=>beep(90,.3,.5,'sawtooth'),120)}

/* ---------- 상태 ---------- */
function setStatus(txt,cls){const s=$('status');s.textContent=txt;s.className=cls||'';}
function setPatient(fn){base=fn;mods=[];lastDisc=null;flatSince=null;hrBeats=[];$('pname').textContent=fn.name;try{if(window.katex)katex.render(fn.tex,$('formula'),{throwOnError:false});else throw 0}catch(e){$('formula').textContent=fn.tex.replace(/\\(frac|sqrt|sin|cos|gcd|sum|lfloor|rfloor|cdot|ldots|bmod|tan)/g,'$1').replace(/[{}\\]/g,'')}
  document.documentElement.style.setProperty('--g',fn.col);[...$('picker').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===fn.id));startVoice(fn.tone,fn.freq?500:0);
  if(fn.id==='flat'){setStatus('심정지','bad flash')}else{setStatus(fn.status,'')}beep(1400,.06,.2);flatline(false)}
function applyOp(op){if(!running)return;if(op==='reset'){mods=[];setStatus(base.status,'');flatline(false);flatSince=null;beep(1760,.1,.3);beep(2200,.2,.3);return}
  if(op==='fast'){speed=Math.min(4,speed*1.5);beep(1200,.06,.25);return}if(op==='slow'){speed=Math.max(.25,speed/1.5);beep(600,.08,.25);return}
  if(op==='flat'){mods.push('flat');setStatus('심정지','bad flash');return}
  if(op==='x2'){sfxShock();$('stage').animate([{filter:'brightness(3)'},{filter:'brightness(1)'}],{duration:300})}
  if(op==='noise')beep(200,.3,.4,'sawtooth');
  mods.push(op);if(mods.length>4)mods.shift();if(op!=='flat'&&mods.includes('flat')){mods=mods.filter(m=>m!=='flat');flatline(false);setStatus('소생!','')}}

/* ---------- 루프 ---------- */
function loop(now){const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;
  if(running){const f=cf();const px=SPX*speed*dt;xHead+=px*XPERPX*(base.period>4?1:1);
    // 샘플 추가 (픽셀 단위)
    const n=Math.max(1,Math.round(px));for(let i=0;i<n;i++){const x=xHead-(n-1-i)*XPERPX;samples.push(f(x))}if(samples.length>W+10)samples.splice(0,samples.length-(W+10));
    const y=samples[samples.length-1];voice(y,base.discrete);
    // 바이탈
    if(samples.length>200){const seg=samples.slice(-240);const mx=Math.max(...seg.filter(v=>!isNaN(v))),mn=Math.min(...seg.filter(v=>!isNaN(v)));const amp=mx-mn;$('amp').textContent=amp.toFixed(1);$('vAMP').className='v'+(amp>14?' bad':amp>9?' warn':'');
      $('pitch').textContent=isNaN(y)?'--':Math.round((base.freq||330)*Math.pow(2,Math.max(-1,Math.min(1,y/9))*2.2))+'Hz';
      // 박동 수: 피크 개수/초 → 분당
      let peaks=0;for(let i=1;i<seg.length-1;i++)if(seg[i]>seg[i-1]&&seg[i]>=seg[i+1]&&seg[i]>mn+amp*.6)peaks++;const sec=240/(SPX*speed);const hr=Math.round(peaks/sec*60/ (base.discrete?1:1));$('hr').textContent=amp<.05?'0':hr;$('vHR').className='v'+(amp<.05||hr>300?' bad':hr>180?' warn':'');
      const tail=samples.slice(-50).filter(v=>!isNaN(v));const tamp=tail.length?Math.max(...tail)-Math.min(...tail):1;if(tamp<.05)$('hr').textContent='0';
      if(tamp<.05){if(!flatSince)flatSince=now;if(now-flatSince>800){flatline(true);if(!$('status').classList.contains('bad'))setStatus('심정지','bad flash')}}else{flatSince=null;flatline(false)}}
    $('clock').textContent=new Date(now).toISOString().substr(14,5)}
  draw();requestAnimationFrame(loop)}
function draw(){g.fillStyle='#000';g.fillRect(0,0,W,H);
  // 격자
  g.strokeStyle='rgba(57,255,138,.08)';g.lineWidth=1;for(let x=0;x<W;x+=24){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=24){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.strokeStyle='rgba(57,255,138,.18)';g.beginPath();g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();
  const col=getComputedStyle(document.documentElement).getPropertyValue('--g').trim()||'#39ff8a';
  const toY=v=>H/2-v/10*(H/2-14);
  // 잔상(어두운 선) + 본선
  const start=Math.max(0,samples.length-W);
  g.lineWidth=2.4;g.lineJoin='round';g.lineCap='round';g.shadowColor=col;g.shadowBlur=12;g.strokeStyle=col;
  if(base.discrete){g.fillStyle=col;for(let i=start;i<samples.length;i++){const v=samples[i];if(isNaN(v))continue;g.beginPath();g.arc(i-start,toY(v),2.2,0,7);g.fill()}}
  else{g.beginPath();let pen=false;for(let i=start;i<samples.length;i++){const v=samples[i];if(isNaN(v)||!isFinite(v)){pen=false;continue}const x=i-start,y=toY(v);if(!pen){g.moveTo(x,y);pen=true}else g.lineTo(x,y)}g.stroke()}
  // 헤드 점 + 스캔 그림자
  if(samples.length){const v=samples[samples.length-1];if(!isNaN(v)){const x=Math.min(W-1,samples.length-1-start),y=toY(v);g.shadowBlur=24;g.fillStyle='#fff';g.beginPath();g.arc(x,y,3.5,0,7);g.fill()}}
  g.shadowBlur=0;const hx=Math.min(W,samples.length-start);const gr=g.createLinearGradient(hx-60,0,hx,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.0)');}
/* ---------- UI ---------- */
for(const fn of FUNCS){const b=document.createElement('button');b.className='fn';b.dataset.id=fn.id;b.style.setProperty('--c',fn.col);b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=fn.name;b.querySelector('small').textContent=fn.cap;b.onclick=()=>{if(!running)return;setPatient(fn)};$('picker').appendChild(b)}
$('ops').addEventListener('click',e=>{const b=e.target.closest('.op');if(b)applyOp(b.dataset.op)});
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(muted){flatline(false)}};
$('go').onclick=()=>{audio();$('tap').classList.add('off');running=true;setPatient(FUNCS[0])};
resize();requestAnimationFrame(loop);
window.__app={setPatient,applyOp,FUNCS,get samples(){return samples},get mods(){return mods}};
</script>
</body>
</html>
