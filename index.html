<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>커맨드 플레이</title>
<meta name="description" content="말로 만든 게임을 바로 플레이하세요. 설치 없이, 브라우저에서.">
<meta property="og:title" content="커맨드 플레이">
<meta property="og:description" content="말로 만든 게임을 바로 플레이하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8e7; --ink:#1b1b2f; --sub:#5b5b72; --card:#ffffff; --line:#1b1b2f;
  --yellow:#ffd23f; --pink:#ff6fae; --sky:#4cc9f0; --green:#7bd389;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15151f;--ink:#f4f1e8;--sub:#a9a8b8;--card:#22222f;--line:#f4f1e8}
}
:root[data-theme="dark"]{--bg:#15151f;--ink:#f4f1e8;--sub:#a9a8b8;--card:#22222f;--line:#f4f1e8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(var(--sub) 1px,transparent 1px);background-size:22px 22px;background-position:-11px -11px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{padding:56px 0 36px}
.logo{font-family:"Black Han Sans",sans-serif;font-size:clamp(44px,9vw,88px);line-height:1;letter-spacing:-1px}
.logo span{background:var(--yellow);color:#1b1b2f;padding:0 .15em;border:3px solid var(--line);border-radius:12px;display:inline-block;transform:rotate(-2deg)}
.prompt{margin-top:22px;display:flex;align-items:center;gap:10px;max-width:560px;background:#2b2d3a;color:#fff;
  border:3px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:5px 5px 0 var(--line);font-weight:700}
.prompt .cursor{display:inline-block;width:2px;height:1.1em;background:var(--yellow);animation:blink 1s steps(1) infinite;vertical-align:middle}
.prompt .send{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#fff;color:#2b2d3a;display:grid;place-items:center;font-weight:900;flex:none}
@keyframes blink{50%{opacity:0}}
.lead{margin-top:18px;color:var(--sub);font-size:17px}
.bar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 18px;gap:12px;flex-wrap:wrap}
.bar h2{font-size:22px;font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding-bottom:64px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:6px 6px 0 var(--line);transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--line);outline:none}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--sky),var(--green));position:relative;border-bottom:3px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Black Han Sans",sans-serif;font-size:28px;color:#fff;text-shadow:2px 2px 0 #1b1b2f}
.badge{position:absolute;top:10px;left:10px;background:var(--pink);color:#fff;font-weight:900;font-size:13px;padding:3px 10px;border-radius:999px;border:2px solid #1b1b2f}
.body{padding:14px 16px 18px}
.body h3{font-size:19px;font-weight:900}
.body p{margin-top:6px;color:var(--sub);font-size:14px;line-height:1.5}
.tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;background:var(--yellow);color:#1b1b2f;border-radius:6px;padding:2px 8px}
.play{margin-top:14px;display:inline-block;font-weight:900;font-size:14px}
.empty{color:var(--sub);padding:40px 0}
footer{border-top:2px dashed var(--sub);padding:22px 0 40px;color:var(--sub);font-size:13px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">커맨드 <span>플레이</span></h1>
    <div class="prompt" aria-hidden="true"><span id="typing"></span><span class="cursor"></span><span class="send">↑</span></div>
    <p class="lead">말 한마디로 만든 게임들. 설치 없이 브라우저에서 바로 플레이하세요.</p>
  </header>

  <section>
    <div class="bar">
      <h2>전체 게임 <span id="count"></span></h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"><p class="empty">게임 불러오는 중…</p></div>
  </section>

  <footer>© <span id="y"></span> Binder · <a href="https://teambinder.ai">teambinder.ai</a></footer>
</div>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
// 타이핑 데모
const lines=['워터슬라이드 세워줘','물 흘려줘','사람 태워줘','출발!'];
let li=0,ci=0,del=false;const el=document.getElementById('typing');
(function tick(){const s=lines[li];
  if(!del){ci++;if(ci>s.length){del=true;return setTimeout(tick,1200)}}
  else{ci--;if(ci===0){del=false;li=(li+1)%lines.length}}
  el.textContent=s.slice(0,ci);setTimeout(tick,del?40:110)})();

let games=[],filter='전체';
function render(){
  const g=document.getElementById('grid');
  const list=filter==='전체'?games:games.filter(x=>(x.tags||[]).includes(filter));
  document.getElementById('count').textContent=games.length?`(${games.length})`:'';
  if(!list.length){g.innerHTML='<p class="empty">아직 게임이 없어요.</p>';return}
  g.innerHTML='';
  for(const x of list){
    const a=document.createElement('a');a.className='card';a.href='games/'+encodeURIComponent(x.id)+'/';
    a.innerHTML=`<div class="thumb"><div class="ph"></div>${x.new?'<span class="badge">NEW</span>':''}</div>
      <div class="body"><h3></h3><p></p><div class="tags"></div><span class="play">▶ 지금 플레이</span></div>`;
    a.querySelector('.ph').textContent=x.title;
    if(x.thumb){const img=new Image();img.alt=x.title;img.onload=()=>a.querySelector('.ph').replaceWith(img);img.src=x.thumb}
    a.querySelector('h3').textContent=x.title;a.querySelector('p').textContent=x.desc||'';
    const t=a.querySelector('.tags');(x.tags||[]).forEach(s=>{const sp=document.createElement('span');sp.className='tag';sp.textContent=s;t.appendChild(sp)});
    g.appendChild(a);
  }
}
function chips(){
  const tags=['전체',...new Set(games.flatMap(x=>x.tags||[]))];const c=document.getElementById('chips');c.innerHTML='';
  tags.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',t===filter);
    b.onclick=()=>{filter=t;chips();render()};c.appendChild(b)});
}
fetch('games.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{games=d;chips();render()})
  .catch(()=>{document.getElementById('grid').innerHTML='<p class="empty">게임 목록을 불러오지 못했어요.</p>'});
</script>
</body>
</html>
